<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Real Life System Setup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap">
<style>
/* Layout: one centered column. Header, a short answers card, then a long plan in four parts that follow the Wendaful Method. */
:root {
  --bg: #faf5f0;
  --surface: #ffffff;
  --surface-2: #f4f1ed;
  --tint: #dadfdc;
  --line: #dfdad4;
  --ink: #373a40;
  --ink-2: #545454;
  --accent: #54645b;
  --accent-ink: #ffffff;
  --sage: #94a69c;
  --hi: #fdfff0;
  --focus: #54645b;
  --font-display: "Playfair Display", Georgia, "Times New Roman", serif;
  --font-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b211e;
    --surface: #232b27;
    --surface-2: #2a332f;
    --tint: #34413a;
    --line: #3b4740;
    --ink: #f0eee7;
    --ink-2: #b7c0ba;
    --accent: #a9bfb1;
    --accent-ink: #17201b;
    --sage: #7f9588;
    --hi: #2b352f;
    --focus: #a9bfb1;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b211e;
  --surface: #232b27;
  --surface-2: #2a332f;
  --tint: #34413a;
  --line: #3b4740;
  --ink: #f0eee7;
  --ink-2: #b7c0ba;
  --accent: #a9bfb1;
  --accent-ink: #17201b;
  --sage: #7f9588;
  --hi: #2b352f;
  --focus: #a9bfb1;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.55 var(--font-body);
}
.wrap {
  max-width: 880px;
  margin: 0 auto;
  padding-block: 32px 72px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3 {
  font-family: var(--font-display);
  font-weight: 600;
  line-height: 1.15;
  text-wrap: balance;
  margin: 0;
}
p { margin: 0; }
a { color: var(--accent); }
.sr-only {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap;
}
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

/* header */
.eyebrow {
  font: 600 12px/1 var(--font-body);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 14px;
}
h1 { font-size: clamp(34px, 6.5vw, 54px); letter-spacing: -0.01em; }
.lede { font-size: 18px; max-width: 58ch; color: var(--ink-2); margin-top: 16px; }
.tagline {
  display: inline-block;
  margin-top: 18px;
  padding: 7px 14px;
  border-radius: 999px;
  background: var(--tint);
  color: var(--ink);
  font-weight: 600;
  font-size: 14px;
}

/* answers card */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 22px;
}
.answers { margin-top: 32px; }
.answers h2 { font-size: 26px; }
.answers .note { color: var(--ink-2); font-size: 15px; margin-top: 6px; }
.fields {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 20px;
  margin-top: 20px;
}
.field { min-width: 0; display: flex; flex-direction: column; gap: 8px; border: 0; padding: 0; margin: 0; }
.field.wide { grid-column: 1 / -1; }
.lab { font-weight: 600; font-size: 14px; padding: 0; }
.hint { font-weight: 400; color: var(--ink-2); }
input[type="text"], select {
  font: inherit;
  color: var(--ink);
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 12px;
  min-height: 44px;
  width: 100%;
}
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { position: relative; }
.pill input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.pill span {
  display: block;
  padding: 10px 15px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface-2);
  font-size: 15px;
  line-height: 20px;
}
.pill input:checked + span { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.pill input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 2px; }
.btn {
  font: 600 15px/1 var(--font-body);
  padding: 14px 20px;
  min-height: 46px;
  border-radius: 999px;
  border: 1px solid var(--accent);
  background: var(--accent);
  color: var(--accent-ink);
  cursor: pointer;
}
.btn.ghost { background: transparent; color: var(--accent); }
.btn.on-accent { background: var(--accent-ink); color: var(--accent); border-color: var(--accent-ink); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }

/* plan */
#plan { margin-top: 40px; }
.banner {
  background: var(--tint);
  border-radius: 12px;
  padding: 12px 16px;
  font-size: 15px;
}
.plan-title { font-size: clamp(28px, 5vw, 40px); margin-top: 28px; }
.intro { max-width: 62ch; color: var(--ink-2); font-size: 17px; margin-top: 12px; }
.intro + .intro { margin-top: 10px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
.part { margin-top: 60px; }
.part-head { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 16px; align-items: end; }
.num { font-family: var(--font-display); font-size: 64px; line-height: 0.9; color: var(--sage); }
.part-head h2 { font-size: clamp(26px, 4.5vw, 36px); }
.part-sub { grid-column: 2; color: var(--ink-2); }
.sub { font-size: 22px; margin-top: 36px; }
.blurb { color: var(--ink-2); max-width: 62ch; margin-top: 8px; }
.rule-box {
  background: var(--hi);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 18px 20px;
  margin-top: 20px;
  max-width: 70ch;
}
.rule-box b { font-family: var(--font-display); font-size: 20px; display: block; margin-bottom: 6px; font-weight: 600; }

.tools { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; margin-top: 20px; }
.tool { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; min-width: 0; }
.tool.hub { background: var(--hi); }
@media (min-width: 720px) { .tool.hub { grid-column: span 2; } }
.tool .lbl { font: 600 11px/1 var(--font-body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-2); }
.tool h3 { font-size: 22px; margin: 10px 0 6px; overflow-wrap: anywhere; }
.tool p { color: var(--ink-2); font-size: 15px; }

.rows { list-style: none; margin: 18px 0 0; padding: 0; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); overflow: hidden; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 4px 20px; padding: 14px 16px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row .a { font-weight: 600; }
.row .b { min-width: 0; overflow-wrap: anywhere; }
.row .b strong { color: var(--accent); }
.row .ex { grid-column: 1 / -1; color: var(--ink-2); font-size: 14px; }
@media (max-width: 560px) { .row { grid-template-columns: 1fr; } }

.checks, .steps, .days { list-style: none; margin: 18px 0 0; padding: 0; display: grid; gap: 10px; }
.check {
  display: flex; gap: 12px; align-items: flex-start; cursor: pointer;
  padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
}
.check input { width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--accent); flex: none; }
.check > span { min-width: 0; }
.check .t { font-weight: 600; display: block; }
.check .d { color: var(--ink-2); font-size: 15px; display: block; margin-top: 2px; }

.step {
  display: grid; grid-template-columns: 68px minmax(0, 1fr); gap: 14px; align-items: start;
  padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
}
.mins { font-family: var(--font-display); font-size: 20px; text-align: center; background: var(--tint); color: var(--ink); border-radius: 10px; padding: 8px 4px; line-height: 1.1; }
.mins small { display: block; font: 500 11px/1.2 var(--font-body); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); margin-top: 2px; }
.step .t { font-weight: 600; display: block; }
.total { margin-top: 12px; color: var(--ink-2); font-size: 15px; }

.sizes { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin-top: 20px; }
.size { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; min-width: 0; }
.size .when { font: 600 11px/1 var(--font-body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-2); }
.size h3 { font-size: 22px; margin-top: 10px; }
.size .time { font-family: var(--font-display); font-size: 32px; color: var(--accent); margin: 2px 0 6px; }
.size p { color: var(--ink-2); font-size: 15px; }

.stuck { background: var(--hi); border: 1px solid var(--line); border-radius: 16px; padding: 22px; margin-top: 20px; }
.tag { display: inline-block; font: 600 11px/1 var(--font-body); letter-spacing: 0.1em; text-transform: uppercase; padding: 6px 10px; border-radius: 999px; background: var(--tint); color: var(--ink); }
.stuck h3 { font-size: 26px; margin-top: 12px; }
.stuck p { max-width: 62ch; margin-top: 10px; }
.try { margin-top: 16px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; max-width: 62ch; }
.try b { display: block; font: 600 11px/1 var(--font-body); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-2); margin-bottom: 6px; }

.list { margin: 12px 0 0; padding-left: 20px; max-width: 62ch; }
.list li + li { margin-top: 6px; }

.day { display: grid; grid-template-columns: 22px 64px minmax(0, 1fr); gap: 12px; align-items: start; cursor: pointer; padding: 12px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.day input { width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--accent); }
.day .n { font: 600 12px/1.6 var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); }

.rules { background: var(--accent); color: var(--accent-ink); border-radius: 18px; padding: 26px; margin-top: 40px; }
.rules h2 { font-size: 30px; }
.rules .sub-t { margin-top: 6px; opacity: 0.9; }
.rules ol { margin: 18px 0 0; padding-left: 24px; display: grid; gap: 8px; max-width: 62ch; }
.rules .btn { margin-top: 20px; }

.foot { margin-top: 56px; padding-top: 24px; border-top: 1px solid var(--line); color: var(--ink-2); }
.foot p + p { margin-top: 8px; }
.foot .big { font-family: var(--font-display); font-size: 24px; color: var(--ink); }

@media print {
  :root, :root[data-theme="dark"], :root:not([data-theme="light"]) {
    --bg: #ffffff; --surface: #ffffff; --surface-2: #ffffff; --tint: #eef0ee; --line: #cfd3d0;
    --ink: #222222; --ink-2: #444444; --accent: #54645b; --accent-ink: #ffffff; --hi: #ffffff; --sage: #94a69c;
    color-scheme: light;
  }
  .no-print { display: none !important; }
  .wrap { padding-block: 0; }
  .part + .part { break-before: page; }
  .tool, .check, .step, .row, .size, .stuck, .day, .rules, .rule-box { break-inside: avoid; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="no-print">
    <p class="eyebrow">Wendaful Planning</p>
    <h1>Real Life System Setup</h1>
    <p class="lede">Tell me what you use. I'll give every tool one job, then build your weekly rhythm and a plan for the days life gets busy.</p>
    <p class="tagline">Set it up. Keep it going.</p>
  </header>

  <form id="answers" class="card answers no-print" autocomplete="off">
    <h2>Your answers</h2>
    <p class="note">Ten quick questions. Everything happens on this page. Nothing is saved or sent anywhere.</p>
    <div class="fields" id="fields"></div>
    <div class="actions">
      <button type="submit" class="btn">Build my setup</button>
    </div>
  </form>

  <p id="status" class="sr-only" role="status"></p>
  <noscript><p class="banner">This page needs JavaScript to build your setup.</p></noscript>
  <main id="plan" tabindex="-1"></main>
</div>

<script>
/* ---------- Things you can edit ---------- */
const CONFIG = {
  ctaText: "Want more help keeping this going? The Planning Lab membership has courses and templates built around this same system.",
  ctaLabel: "See the Planning Lab",
  ctaUrl: "https://wendaful.com",
  partOf: "This setup is part of the Real Life System."
};
/* Add page names or tips for a specific planner here. They show up in the planner setup step. */
const PLANNER_NOTES = {
  rls: "",
  weekly: "", daily: "", bujo: "", digital: "", none: ""
};

/* ---------- Questions ---------- */
const FIELDS = [
  { id: "name", type: "text", label: "What should I call you?", hint: "Optional", placeholder: "Your first name", max: 30 },
  { id: "kind", type: "select", label: "What kind of planner do you use?", def: "weekly", options: [
    ["rls", "Real Life System Planner"],
    ["weekly", "Weekly planner"],
    ["daily", "Daily planner"],
    ["bujo", "Bullet journal or notebook"],
    ["digital", "Digital planner"],
    ["none", "I don't have one yet"]
  ] },
  { id: "pname", type: "text", label: "Planner name", hint: "Optional", placeholder: "The name on the cover", max: 40 },
  { id: "cal", type: "select", label: "Where do your appointments live?", def: "apple", options: [
    ["apple", "Apple Calendar"], ["google", "Google Calendar"], ["outlook", "Outlook Calendar"],
    ["paper", "Paper calendar only"], ["other", "Another calendar app"]
  ] },
  { id: "tasks", type: "select", label: "Where do your to-dos live?", def: "reminders", options: [
    ["reminders", "Apple Reminders"], ["todoist", "Todoist"], ["gtasks", "Google Tasks"],
    ["app", "Another app (Notion, ClickUp, and so on)"], ["paper", "Paper lists"], ["mess", "All over the place"]
  ] },
  { id: "notes", type: "select", label: "Where do your notes live?", def: "apple", options: [
    ["apple", "Apple Notes"], ["google", "Google Docs or Keep"], ["notion", "Notion"],
    ["paper", "A paper notebook"], ["mess", "All over the place"]
  ] },
  { id: "when", type: "pills", label: "When do you plan?", def: "night", options: [
    ["night", "The night before"], ["morning", "In the morning"], ["weekly", "Once a week"]
  ] },
  { id: "mins", type: "pills", label: "How many minutes a day can you really give it?", def: "10", options: [
    ["5", "5"], ["10", "10"], ["15", "15"], ["20", "20 or more"]
  ] },
  { id: "stuck", type: "select", label: "Where do you get stuck?", def: "fallsoff", wide: true, options: [
    ["fallsoff", "I start strong, then stop"],
    ["where", "I never know where things go"],
    ["places", "I write things in too many places"],
    ["overwhelm", "My lists get too long and I feel behind"],
    ["followthrough", "I plan it all but don't do it"],
    ["hopping", "I keep switching planners and apps"]
  ] },
  { id: "area", type: "pills", label: "What do you want it to run first?", def: "home", options: [
    ["home", "Home"], ["business", "Business"], ["content", "Content"],
    ["kids", "Kids and school"], ["health", "Health"], ["money", "Money"]
  ] },
  { id: "style", type: "pills", label: "What kind of system do you like?", def: "simple", options: [
    ["simple", "Simple and flexible"], ["detailed", "Detailed and structured"],
    ["pretty", "Pretty and creative"], ["hands", "Low maintenance"]
  ] }
];

/* ---------- Tool labels ---------- */
const CALS = {
  apple: { name: "Apple Calendar", ref: "Apple Calendar" },
  google: { name: "Google Calendar", ref: "Google Calendar" },
  outlook: { name: "Outlook Calendar", ref: "Outlook Calendar" },
  paper: { name: "Paper calendar", ref: "your paper calendar" },
  other: { name: "Calendar app", ref: "your calendar app" }
};
const TASKS = {
  reminders: { name: "Apple Reminders", ref: "Apple Reminders", digital: true },
  todoist: { name: "Todoist", ref: "Todoist", digital: true },
  gtasks: { name: "Google Tasks", ref: "Google Tasks", digital: true },
  app: { name: "Task app", ref: "your task app", digital: true },
  paper: { name: "Master List", ref: "your Master List", digital: false },
  mess: { name: "Master List", ref: "your Master List", digital: false }
};
const NOTES = {
  apple: { name: "Apple Notes", ref: "Apple Notes" },
  google: { name: "Google Docs or Keep", ref: "Google Docs or Keep" },
  notion: { name: "Notion", ref: "Notion" },
  paper: { name: "Notes notebook", ref: "your notes notebook" },
  mess: { name: "One notes app", ref: "your notes app" }
};
const KINDS = {
  rls: { name: "Real Life System Planner", ref: "your Real Life System Planner" },
  weekly: { name: "Weekly planner", ref: "your planner" },
  daily: { name: "Daily planner", ref: "your planner" },
  bujo: { name: "Notebook planner", ref: "your notebook" },
  digital: { name: "Digital planner", ref: "your digital planner" },
  none: { name: "Notebook", ref: "your notebook" }
};
const AREAS = {
  home: "Home", business: "Business", content: "Content",
  kids: "Kids and school", health: "Health", money: "Money"
};
const EX = {
  home: { appt: "Plumber comes Thursday at 10", task: "Order the new vacuum filters", inbox: "We are almost out of paper towels", note: "The paint color we picked for the hallway", repeat: "Trash and recycling day", big: "\"Clean out the garage\" becomes \"Move the bikes to one wall.\"" },
  business: { appt: "Call with a brand at 1:00", task: "Send the Friday email", inbox: "An idea for a new freebie", note: "Notes from the sponsor call", repeat: "Email day every week", big: "\"Write the sales page\" becomes \"Write the headline.\"" },
  content: { appt: "Filming day on Tuesday at 9", task: "Edit the Reel for Friday", inbox: "An idea for a carousel", note: "Hooks I want to try", repeat: "Your posting days", big: "\"Plan a month of content\" becomes \"List five ideas.\"" },
  kids: { appt: "Dentist on Monday at 3:30", task: "Sign the field trip form", inbox: "Ask about the carpool", note: "Teacher email and class list", repeat: "Practice every Wednesday", big: "\"Plan the birthday party\" becomes \"Pick a date.\"" },
  health: { appt: "Checkup on the 12th at 8", task: "Book the eye appointment", inbox: "Try that stretching video", note: "My workout plan", repeat: "Walks on Monday and Thursday", big: "\"Get back into working out\" becomes \"Walk for five minutes.\"" },
  money: { appt: "Meeting with the tax person at 2", task: "Pay the water bill", inbox: "Look into a savings plan", note: "Budget notes and savings goals", repeat: "Bill due dates", big: "\"Fix the budget\" becomes \"List this month's bills.\"" }
};
const WHEN_TEXT = { night: "the night before", morning: "in the morning", weekly: "once a week" };

/* ---------- Helpers ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c]));
const done = new Set();
const chk = key => `<input type="checkbox" data-k="${key}"${done.has(key) ? " checked" : ""}>`;
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

/* ---------- Build the form ---------- */
const form = document.getElementById("answers");
const fieldsEl = document.getElementById("fields");
const planEl = document.getElementById("plan");
const statusEl = document.getElementById("status");

function buildForm() {
  fieldsEl.innerHTML = FIELDS.map(f => {
    const hint = f.hint ? ` <span class="hint">(${f.hint})</span>` : "";
    if (f.type === "text") {
      return `<div class="field"><label class="lab" for="f-${f.id}">${f.label}${hint}</label>
        <input type="text" id="f-${f.id}" maxlength="${f.max}" placeholder="${f.placeholder}"></div>`;
    }
    if (f.type === "select") {
      const opts = f.options.map(o => `<option value="${o[0]}"${o[0] === f.def ? " selected" : ""}>${o[1]}</option>`).join("");
      return `<div class="field${f.wide ? " wide" : ""}"><label class="lab" for="f-${f.id}">${f.label}</label>
        <select id="f-${f.id}">${opts}</select></div>`;
    }
    const pills = f.options.map(o => `<label class="pill"><input type="radio" name="${f.id}" id="f-${f.id}-${o[0]}" value="${o[0]}"${o[0] === f.def ? " checked" : ""}><span>${o[1]}</span></label>`).join("");
    return `<fieldset class="field wide"><legend class="lab">${f.label}</legend><div class="pills">${pills}</div></fieldset>`;
  }).join("");
}

function read() {
  const a = {};
  for (const f of FIELDS) {
    if (f.type === "pills") {
      const c = form.querySelector(`input[name="${f.id}"]:checked`);
      a[f.id] = c ? c.value : f.def;
    } else {
      a[f.id] = document.getElementById("f-" + f.id).value.trim();
    }
  }
  a.mins = Number(a.mins) || 10;
  return a;
}

/* ---------- Content builders ---------- */
function refs(a) {
  const cal = CALS[a.cal];
  const tasks = TASKS[a.tasks];
  const notes = NOTES[a.notes];
  const pn = a.pname ? esc(a.pname) : "";
  const kind = KINDS[a.kind];
  const planner = pn ? { name: pn, ref: "your " + pn } : kind;
  const inbox = tasks.digital
    ? { name: "Inbox list", ref: a.tasks === "todoist" ? "your Todoist Inbox" : `the Inbox list in ${tasks.ref}` }
    : { name: "Brain Dump page", ref: `your Brain Dump page` };
  return { cal, tasks, notes, planner, inbox, N: a.style === "hands" ? 2 : 3, area: AREAS[a.area], ex: EX[a.area] };
}

function setupItems(a, r) {

  const stepByKind = {
    weekly: `Open to this week. Write your Top ${N} for the week at the top. Add this week's appointments from ${cal.ref} so you can see how your week fits together. If something changes, change it in ${cal.ref} first.`,
    daily: `Open to ${day}'s page. Leave the pages ahead blank. You only fill in one page at a time, and that is plenty.`,
    bujo: `Set up ${pages.length === 3 ? "three" : "four"} pages: ${pages.join(", ")}. Skip the fancy index for now. Add more pages only when you need them.`,
    digital: `Duplicate one weekly page and one brain dump page. Keep everything in one planning app so you have nothing to hop to. Write your Top ${N} on the weekly page.`,
    none: `Grab any notebook you already own and use it for 30 days before you buy a planner. Set up ${pages.length === 3 ? "three" : "four"} pages: ${pages.join(", ")}.`
  };
  stepByKind.rls = stepByKind.weekly;
  items.push({
    t: `Set up ${planner.ref}`,
    d: stepByKind[a.kind] + (PLANNER_NOTES[a.kind] ? " " + PLANNER_NOTES[a.kind] : "")
  });

  items.push({
    t: "Pick your planning time",
    d: a.when === "weekly"
      ? `Pick one day for your weekly reset. Add it to ${cal.ref} as a repeating event so you never have to remember it.`
      : `Pick a spot you already sit down, like ${a.when === "night" ? "after dinner" : "with your coffee"}. Set a repeating phone alarm called "Plan, ${a.mins} minutes."`
  });

  items.push({
    t: "Copy your rules",

  return items;
}

const DAILY = {

function dailySteps(a, r) {

        [1, "Find the first step", "Choose the tiny first step and do it when you have a free minute."]
      ]
    };
  }
  const text = {
    back: ["Look back", `${a.when === "morning" ? "Look at yesterday" : "Look at today"}. Cross off what got done. Move one thing forward or let it go on purpose.`],
    cal: ["Schedule first", `Look at ${day} in ${cal.ref}. Your appointments make the frame for the day.`],
    energy: ["Check your energy", `Is ${day} a full day, a medium day, or a low day? Plan for the day you really have.`],

  return {

}

function weeklySteps(a, r) {

  return [

}

function buildPlan(a, sample) {

  h += `<div class="days">` + fourteenDays(a, r).map((d, i) =>
    `<label class="day">${chk("day-" + i)}<span class="n">Day ${i + 1}</span><span><b>${d[0]}.</b> ${d[1]}</span></label>`).join("") + `</div>`;

  h += `<div class="rules" id="rules"><h2>My system rules</h2><p class="sub-t">Copy these onto the inside cover of your planner.</p>
    <ol>${rules.map(t => `<li>${t}</li>`).join("")}</ol>
    <button type="button" class="btn on-accent no-print" id="copyRules">Copy my rules</button></div></section>`;

  h += `<footer class="foot"><p class="big">Set it up. Keep it going.</p><p>${CONFIG.partOf}</p>
    <p class="no-print">${CONFIG.ctaText} <a href="${CONFIG.ctaUrl}" target="_blank" rel="noopener">${CONFIG.ctaLabel}</a></p></footer>`;
  return h;
}

/* ---------- Render and wire up ---------- */
let touched = false;
const rulesText = () => Array.from(document.querySelectorAll("#rules li")).map((li, i) => (i + 1) + ". " + li.textContent).join("\n");

function render() {
  const a = read();
  planEl.innerHTML = buildPlan(a, !touched);
  const inFrame = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
  const pb = document.getElementById("printBtn");
  if (pb && !inFrame) pb.hidden = false;
  statusEl.textContent = touched ? "Your setup was updated." : "";
}

function flash(btn, msg) {
  if (!btn.dataset.label) btn.dataset.label = btn.textContent;
  btn.textContent = msg;
  setTimeout(() => { btn.textContent = btn.dataset.label; }, 1800);
}

async function copyText(text, btn) {
  try {
    await navigator.clipboard.writeText(text);
    flash(btn, "Copied");
    return;
  } catch (e) { /* fall through */ }
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    if (ok) { flash(btn, "Copied"); return; }
  } catch (e) { /* fall through */ }
  flash(btn, "Select the text and copy it");
}

form.addEventListener("input", () => { touched = true; render(); });
form.addEventListener("submit", e => {
  e.preventDefault();
  touched = true;
  render();
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  planEl.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
  planEl.focus({ preventScroll: true });
});
planEl.addEventListener("change", e => {
  const k = e.target && e.target.dataset && e.target.dataset.k;
  if (!k) return;
  if (e.target.checked) done.add(k); else done.delete(k);
});
planEl.addEventListener("click", e => {
  const id = e.target && e.target.id;
  if (id === "copyPlan") copyText("Real Life System Setup\n\n" + planEl.innerText, e.target);
  if (id === "copyRules") copyText("My system rules\n" + rulesText(), e.target);
  if (id === "printBtn") window.print();
});

buildForm();
render();
</script>
</body>
</html>
