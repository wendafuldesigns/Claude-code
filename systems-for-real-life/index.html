<title>Real Life System Assistant</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Instrument+Serif:ital@0;1&family=Playfair+Display:wght@500&display=swap">
<style>
/* Layout concept: a paper workbook turned into an app. Ruled lines you type on,
   hairline strips for page headers, evergreen cover bands for each level,
   a course outline on the left and one workbook page at a time on the right. */
:root{
  --bg:#faf5f0; --surface:#ffffff; --panel:#f4f1ed; --callout:#dadfdc; --warm:#ece4d8;
  --rule:#d6d1c9; --edge:#373a40; --ink:#373a40; --muted:#545454;
  --accent:#54645b; --sage:#94a69c; --btn:#54645b; --btn-ink:#ffffff;
  --hero:#54645b; --hero-ink:#ffffff; --hero-sub:#e4eae6; --hero-rule:rgba(255,255,255,.35);
  --example:#4a5b52;
  --serif:'Instrument Serif','Iowan Old Style','Palatino Linotype',Georgia,serif;
  --sans:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --brand:'Playfair Display',Georgia,serif;
  --lh:36px; --hdr:56px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161c19; --surface:#1e2622; --panel:#252e29; --callout:#2e3933; --warm:#38342b;
    --rule:#3a4640; --edge:#6d7a73; --ink:#ebe8e2; --muted:#aab2ad;
    --accent:#a9bbb1; --sage:#94a69c; --btn:#94a69c; --btn-ink:#14201a;
    --hero:#33403a; --hero-ink:#f4f1ed; --hero-sub:#cdd6d0; --hero-rule:rgba(255,255,255,.25);
    --example:#b9c9bf;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161c19; --surface:#1e2622; --panel:#252e29; --callout:#2e3933; --warm:#38342b;
  --rule:#3a4640; --edge:#6d7a73; --ink:#ebe8e2; --muted:#aab2ad;
  --accent:#a9bbb1; --sage:#94a69c; --btn:#94a69c; --btn-ink:#14201a;
  --hero:#33403a; --hero-ink:#f4f1ed; --hero-sub:#cdd6d0; --hero-rule:rgba(255,255,255,.25);
  --example:#b9c9bf;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--sans);-webkit-font-smoothing:antialiased;text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent);text-underline-offset:3px}
p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- type ---------- */
h1,h2,h3,h4{font-family:var(--serif);font-weight:400;color:var(--accent);margin:0;text-wrap:balance;letter-spacing:-.005em}
.h1{font-size:clamp(2.6rem,6.2vw,3.9rem);line-height:.98}
h2{font-size:clamp(1.65rem,3.4vw,2.05rem);line-height:1.1}
h3{font-size:1.5rem;line-height:1.12}
h4{font-size:1.25rem;line-height:1.15}
.eyebrow{font:600 11px/1.3 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.lede{font-size:1.1rem;line-height:1.5;max-width:56ch}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.ex{font-family:var(--serif);font-style:italic;color:var(--example);font-size:1.15em}

/* ---------- app shell ---------- */
.app{height:100%;display:flex;flex-direction:column}
.top{flex:none;background:var(--bg);border-bottom:1px solid var(--rule);z-index:5}
.top-in{height:var(--hdr);display:flex;align-items:center;gap:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.menu{display:none;flex:none;width:40px;height:40px;border:1px solid var(--rule);background:var(--surface);border-radius:2px;align-items:center;justify-content:center}
.menu svg{width:18px;height:18px;stroke:var(--ink)}
.brand{display:flex;align-items:baseline;gap:12px;background:none;border:0;padding:0;text-align:left;min-width:0}
.brand .wm{font:500 1.35rem/1 var(--brand);color:var(--accent);letter-spacing:.01em}
.brand .ttl{font:600 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topstat{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:.8125rem;color:var(--muted);white-space:nowrap}
.mini{width:110px;height:6px;background:var(--callout);border-radius:3px;overflow:hidden}
.mini i{display:block;height:100%;width:0;background:var(--btn);transition:width .4s ease}
.shell{flex:1;min-height:0;display:grid;grid-template-columns:304px minmax(0,1fr)}
.side{overflow:auto;border-right:1px solid var(--rule);background:var(--bg);overscroll-behavior:contain}
.side-in{padding:18px max(16px,env(safe-area-inset-left,0px)) 40px 16px;display:flex;flex-direction:column;gap:6px}
.main{overflow:auto;min-width:0;scroll-behavior:auto;outline:0}
.scrim{position:fixed;inset:0;background:rgba(20,28,24,.5);z-index:19}

/* sidebar */
.nv-top{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
.nv{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-left:2px solid transparent;padding:8px 8px 8px 10px;color:var(--ink);font-size:.9375rem;line-height:1.3;min-height:38px}
.nv:hover{background:var(--panel)}
.nv.on{background:var(--panel);border-left-color:var(--accent);font-weight:600}
.nv .mk{flex:none}
.nh{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:14px 4px 8px;color:var(--ink)}
.nh .t{flex:1;min-width:0}
.nh .t b{display:block;font:400 1.2rem/1.1 var(--serif);color:var(--accent)}
.nh .cnt{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.nh .chev{width:10px;height:10px;border:solid var(--muted);border-width:0 1.5px 1.5px 0;transform:rotate(45deg);transition:transform .15s;margin:0 4px 3px 0;flex:none}
.nh[aria-expanded="true"] .chev{transform:rotate(-135deg);margin:4px 4px 0 0}
.nl{display:none;flex-direction:column;padding-bottom:6px}
.nl.open{display:flex}
.mk{width:16px;height:16px;border:1.5px solid var(--sage);border-radius:50%;position:relative;flex:none;background:transparent}
.mk.on{background:var(--btn);border-color:var(--btn)}
.mk.on::after{content:"";position:absolute;left:4.5px;top:1.5px;width:4px;height:7px;border:solid var(--btn-ink);border-width:0 1.8px 1.8px 0;transform:rotate(45deg)}
.sidehead{font:600 11px/1.3 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:16px 4px 2px}
.sidesub{font:600 .75rem/1.3 var(--sans);color:var(--muted);padding:12px 10px 2px}
.bul{width:16px;height:16px;flex:none;position:relative}
.bul::after{content:"";position:absolute;left:6px;top:6px;width:4px;height:4px;border-radius:50%;background:var(--sage)}
.savenote{margin-top:14px;padding:12px;background:var(--panel);font-size:.8125rem;color:var(--muted);line-height:1.45}

/* ---------- page frame ---------- */
.wrap{width:100%;max-width:840px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap.wide{max-width:1040px}
.lesson{padding-bottom:64px;animation:rise .28s ease both}
@keyframes rise{from{opacity:.35;transform:translateY(6px)}to{opacity:1;transform:none}}
.strip{display:flex;justify-content:space-between;gap:16px;padding:22px 0 10px;border-bottom:1px solid var(--rule);font:600 11px/1.3 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.head{padding:30px 0 6px;display:flex;flex-direction:column;gap:14px}
.body{padding-top:26px;display:flex;flex-direction:column;gap:30px}
.cover{background:var(--hero);color:var(--hero-ink)}
.cover .strip{color:var(--hero-sub);border-bottom-color:var(--hero-rule)}
.cover .cv{padding:56px 0 46px;display:flex;flex-direction:column;gap:14px;min-height:300px;justify-content:flex-end}
.cover .eyebrow{color:var(--hero-sub);letter-spacing:.2em}
.cover .h1{color:var(--hero-ink)}
.cover .sub{font-size:1.2rem;color:var(--hero-ink);max-width:40ch}
.stack{display:flex;flex-direction:column;gap:18px}
.stack.tight{gap:10px}
.sec{display:flex;flex-direction:column;gap:14px}
.sec>.eyebrow{margin-bottom:-2px}

/* ---------- cards, callouts ---------- */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,var(--min,250px)),1fr));gap:16px;align-items:stretch}
.card{background:var(--panel);padding:20px;border-radius:2px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.out{background:var(--surface);border:1px solid var(--edge)}
.card.dark{background:var(--hero);color:var(--hero-ink)}
.card.dark h3,.card.dark h4,.card.dark .eyebrow,.card.dark .muted{color:var(--hero-ink)}
.card.dark .eyebrow{opacity:.85}
.card h3,.card h4{margin-top:-2px}
.card .sub{color:var(--muted);font-size:.9375rem;margin-top:-4px}
.card.sel{outline:2px solid var(--accent);outline-offset:-2px}
button.card{text-align:left;border:0;color:inherit;font:inherit;width:100%}
button.card:hover{background:var(--callout)}
.bar{background:var(--callout);padding:14px 18px;border-radius:2px;line-height:1.5;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.bar strong{font-weight:650}
.dark-bar{background:var(--hero);color:var(--hero-ink);padding:22px;border-radius:2px;display:flex;flex-direction:column;gap:10px}
.dark-bar h3{color:var(--hero-ink)}
.dark-bar a{color:var(--hero-ink);font-weight:650}
.badge{display:inline-block;align-self:flex-start;font:600 10.5px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;padding:5px 8px;background:var(--callout);color:var(--ink);border-radius:2px}
.badge.you{background:var(--btn);color:var(--btn-ink)}
.badge.on{background:var(--btn);color:var(--btn-ink)}
.badge.warm{background:var(--warm)}
.bar.good{background:var(--callout)}
.bar.soft{background:var(--warm)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:11px 20px;border:1px solid var(--btn);background:var(--btn);color:var(--btn-ink);font:600 .9375rem/1.2 var(--sans);border-radius:2px;text-decoration:none}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--edge)}
.btn.ghost:hover{background:var(--panel);filter:none}
.btn.sm{min-height:36px;padding:7px 14px;font-size:.875rem}
.btn[disabled]{opacity:.45;cursor:default}
.link{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px;font:inherit;font-weight:550;cursor:pointer;text-align:left}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* ---------- fields ---------- */
.fld{display:flex;flex-direction:column;gap:2px;min-width:0}
.lbl{font:600 .9375rem/1.35 var(--sans);color:var(--ink)}
.hint{font-weight:400;color:var(--muted)}
.ln{width:100%;display:block;border:0;border-bottom:1px solid var(--rule);background:transparent;color:var(--ink);font:400 1rem/1.4 var(--sans);padding:9px 2px 7px;border-radius:0;outline:0;min-height:42px}
.ln::placeholder{color:var(--muted);opacity:.55}
.ln:focus{border-bottom-color:var(--accent);box-shadow:0 1px 0 var(--accent);background:color-mix(in srgb,var(--accent) 6%,transparent)}
.ta{resize:none;overflow:hidden;line-height:var(--lh);padding:0 2px;min-height:calc(var(--rows,2) * var(--lh));border-bottom:0;
  background-image:linear-gradient(to bottom,transparent calc(var(--lh) - 1px),var(--rule) calc(var(--lh) - 1px));
  background-size:100% var(--lh);background-attachment:local;background-color:transparent}
.ta:focus{box-shadow:none;background-color:color-mix(in srgb,var(--accent) 6%,transparent)}
.inl{display:flex;align-items:baseline;gap:10px;min-width:0}
.inl .lbl{flex:none}
.inl .ln{flex:1;min-width:0}
.fld.inl{flex-direction:row;flex-wrap:wrap;align-items:baseline;gap:2px 12px}
.fld.inl .ln{flex:1 1 180px}
.num{display:flex;align-items:center;gap:12px}
.num .n{flex:none;width:28px;height:28px;border:1.5px solid var(--edge);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font:600 .8125rem/1 var(--sans);color:var(--ink)}
.num.solid .n{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.num .ln{flex:1}
select.ln{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 14px) 55%,calc(100% - 9px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}

/* checkboxes and radios */
.chkgrid{display:grid;grid-template-columns:repeat(var(--c,1),minmax(0,1fr));gap:0 28px}
.chk{display:flex;gap:12px;align-items:flex-start;cursor:pointer;line-height:1.4;padding:7px 0;position:relative;min-width:0}
.chk>input{position:absolute;opacity:0;width:24px;height:24px;margin:0;left:0;top:5px;cursor:pointer}
.chk .box{flex:none;width:20px;height:20px;border:1.5px solid var(--edge);background:var(--surface);margin-top:1px;border-radius:2px;position:relative;transition:background .15s,border-color .15s}
.chk .box::after{content:"";position:absolute;left:5.5px;top:1.5px;width:6px;height:11px;border:solid var(--btn-ink);border-width:0 2px 2px 0;transform:rotate(45deg) scale(0);transition:transform .15s}
.chk input:checked+.box{background:var(--btn);border-color:var(--btn)}
.chk input:checked+.box::after{transform:rotate(45deg) scale(1)}
.chk input:focus-visible+.box{outline:2px solid var(--accent);outline-offset:2px}
.chk .lbl{font-weight:400;flex:1;min-width:0}
.chk.line .lbl{display:flex;align-items:center}
.chk.line .ln{padding-top:4px;padding-bottom:4px;min-height:34px}
.strike input:checked~.lbl{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--sage)}
.rad{display:inline-flex;gap:8px;align-items:center;cursor:pointer;position:relative;padding:8px 4px;min-height:40px}
.rad input{position:absolute;opacity:0;width:22px;height:22px;margin:0;left:2px}
.rad .dot{flex:none;width:20px;height:20px;border:1.5px solid var(--edge);border-radius:50%;background:var(--surface);position:relative}
.rad .dot::after{content:"";position:absolute;inset:3.5px;border-radius:50%;background:var(--btn);transform:scale(0);transition:transform .15s}
.rad input:checked+.dot::after{transform:scale(1)}
.rad input:checked+.dot{border-color:var(--btn)}
.rad input:focus-visible+.dot{outline:2px solid var(--accent);outline-offset:2px}
.radrow{display:flex;flex-wrap:wrap;gap:4px 22px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:500 .875rem/1.15 var(--sans);padding:9px 14px;border:1px solid var(--edge);background:var(--surface);color:var(--ink);border-radius:2px;min-height:40px;text-align:center}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.chip.right{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.chip.wrong{background:var(--warm);border-style:dashed}
.tg{width:34px;height:34px;border:1.5px solid var(--edge);background:var(--surface);border-radius:2px;display:inline-flex;align-items:center;justify-content:center;font:600 .8125rem/1 var(--sans);color:var(--ink);padding:0}
.tg.r{border-radius:50%}
.tg[aria-pressed="true"]{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.tg:hover{border-color:var(--accent)}
.star{font-size:1.25rem;line-height:1;background:none;border:0;padding:6px;color:var(--accent);min-width:40px;min-height:40px}

/* ---------- row grids (tables that stack on phones) ---------- */
.rows{display:flex;flex-direction:column;border-top:1px solid var(--edge)}
.rw{display:grid;grid-template-columns:var(--cols,1fr);gap:4px 18px;align-items:start;padding:10px 0;border-bottom:1px solid var(--rule)}
.rw.hd{padding:10px 0 8px;font:600 11px/1.3 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.rw.exr{background:var(--panel);padding-left:10px;padding-right:10px;margin-left:-10px;margin-right:-10px}
.rw .cell{min-width:0;display:flex;flex-direction:column;gap:2px}
.rw .cell[data-label]::before{content:attr(data-label);display:none;font:600 10.5px/1.2 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.rw .ro{font-weight:600}
.rw .ro small{display:block;font-weight:400;color:var(--muted);font-size:.8125rem}
.rw .exv{font-family:var(--serif);font-style:italic;color:var(--example);font-size:1.15rem;line-height:1.3;padding:6px 2px}
.rw .mid{align-self:center}
.rw .cell.mid{align-items:flex-start}
.rw .ln{min-height:40px}
.rw .ta{--lh:30px}

/* tabs */
.tabs{display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--edge)}
.tab{background:none;border:1px solid transparent;border-bottom:0;padding:11px 16px;font:600 .875rem/1 var(--sans);color:var(--muted);border-radius:2px 2px 0 0;margin-bottom:-1px;min-height:44px}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);border-color:var(--edge);border-bottom:1px solid var(--surface)}
.panel{padding-top:22px}

/* toc / lesson lists */
.toc{border-top:1px solid var(--edge)}
.toc-row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:14px 4px;min-height:60px}
.toc-row:hover{background:var(--panel)}
.toc-row .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.toc-row strong{font-weight:650}
.toc-row small{color:var(--muted);font-size:.875rem}
.toc-row .go{color:var(--accent);font-size:1.1rem}

/* progress */
.track{height:8px;background:var(--callout);border-radius:4px;overflow:hidden}
.track i{display:block;height:100%;background:var(--btn);width:0;transition:width .4s ease}

/* timers */
.timer{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:16px 18px;background:var(--panel);border-radius:2px}
.timer .t{font:400 2.6rem/1 var(--serif);font-variant-numeric:tabular-nums;color:var(--accent);min-width:4.4ch}
.timer .msg{flex-basis:100%;font-weight:600;color:var(--accent)}

/* pager */
.pager{margin-top:44px;padding-top:20px;border-top:1px solid var(--edge);display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center}
.pager .where{flex-basis:100%;display:flex;justify-content:space-between;font-size:.8125rem;color:var(--muted);order:3;padding-top:10px}
.legal{font-size:.8125rem;color:var(--muted);line-height:1.5;max-width:70ch;padding-top:26px}

/* home */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px}
.tile{display:flex;flex-direction:column;gap:8px;text-align:left;border:0;padding:20px;min-height:210px;border-radius:2px;background:var(--callout);color:var(--ink);justify-content:space-between}
.tile.d{background:var(--hero);color:var(--hero-ink)}
.tile .eyebrow{color:inherit;opacity:.8}
.tile h3{color:inherit;font-size:1.6rem}
.tile p{font-size:.9375rem;max-width:none}
.tile .fin{font-size:.875rem}
.tile .pg{display:flex;align-items:center;gap:10px;font-size:.8125rem}
.tile .pg .track{flex:1;background:rgba(0,0,0,.12)}
.tile.d .pg .track{background:rgba(255,255,255,.25)}
.tile .pg .track i{background:currentColor}
.tile:hover{filter:brightness(.97)}
.bonus{display:flex;flex-direction:column;gap:6px;border:1px solid var(--edge);background:var(--surface);padding:18px;text-align:left;border-radius:2px}
.bonus h4{font-size:1.4rem}
.bonus:hover{background:var(--panel)}

/* misc */
.pill{font-size:.75rem;font-weight:600;padding:3px 9px;background:var(--callout);border-radius:99px;white-space:nowrap}
.tip{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule)}
.tip:last-child{border-bottom:0}
.tip b{flex:none;min-width:8.5rem;font-weight:650}
.dl{display:grid;grid-template-columns:minmax(120px,200px) 1fr;gap:6px 18px}
.dl dt{font-weight:650}
.dl dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.flash{animation:flash 1.6s ease}
@keyframes flash{0%,60%{box-shadow:0 0 0 3px var(--sage)}100%{box-shadow:0 0 0 0 transparent}}

let UID = 0;

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);

    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "value" || k === "checked" || k === "disabled" || k === "selected") el[k] = v;
    else if (k === "style" && typeof v === "object") {
      for (const sk in v) { if (sk.startsWith("--")) el.style.setProperty(sk, v[sk]); else el.style[sk] = v[sk]; }

    else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);

  for (const kid of kids.flat(Infinity)) {

}

/* **bold** and *italic* inside strings */
function rt(s) {
  const f = document.createDocumentFragment();

    if (!p) return;
    if (p.startsWith("**")) f.append(h("strong", null, p.slice(2, -2)));
    else if (p[0] === "*" && p.length > 2) f.append(h("em", null, p.slice(1, -1)));
    else f.append(p);

  return f;
}

const KEY = "wendaful-sfrl-v1";
let S = {};

let saveT = null;
function paintSave(pending) {

}
function flush() {

function clearPrefix(p) { Object.keys(S).forEach(k => { if (k.startsWith(p)) delete S[k]; }); queueSave(); }

const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };

/* ============ toast, copy, save a file ============ */
let toastT = null;
function toast(msg) {

}

  try { await navigator.clipboard.writeText(text); toast("Copied"); return true; }
  catch (e) {
    const ta = h("textarea", { style: { position: "fixed", opacity: "0", left: "0", top: "0" } });
    ta.value = text; document.body.append(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch (_) { }
    ta.remove(); toast(ok ? "Copied" : "Copy did not work here. Select the text and copy it."); return ok;
  }

let DL = null;
(async () => { try { if (window.claude && claude.use) DL = await claude.use("downloads"); } catch (e) { DL = null; } })();

  try { await DL.save({ filename: name, data }); toast("Saved"); return true; }
  catch (e) { if (!e || e.code !== "declined") toast("Could not save a file here. Use Copy instead."); return false; }
}

/* ============ form pieces ============ */

    o && o.label ? h("div", { class: "lbl" }, rt(o.label), o.hint ? h("span", { class: "hint" }, " " + o.hint) : null) : null,
    child);
}

/* lined single line or ruled paper (rows > 1) */

function dotRadio(k, v, name, aria) {

    const tally = () => LV.map((lv, i) => lv[1].filter((_, j) => get("lvl." + i + "." + j)).length);
    const paint = () => {
      const t = tally(), max = Math.max(...t);
      res.replaceChildren();
      if (!max) { res.append(p("Check the lines that sound like you. Your result shows up here.", "muted")); return; }
      const top = t.map((n, i) => n === max ? i : -1).filter(i => i >= 0);
      const names = top.map(i => "Level " + (i + 1));
      res.append(
        h("div", { class: "row" }, ...t.map((n, i) => h("span", { class: "badge " + (top.includes(i) ? "on" : "") }, "Level " + (i + 1) + ": " + n))),
        p(top.length === 1 ? "**" + names[0] + " has the most checks.** That’s a good place to slow down and spend extra time."
          : "**" + names.join(" and ") + " are tied.** Start with the lower number and slow down there."),
        btn("Put it on my line", () => { const v = "Level " + (top[0] + 1) + ": " + LV[top[0]][0]; set("lvl.most", v); const i = lineFld.input; i.value = v; toast("Added"); }, "sm"));
    };
    const lineFld = field("lvl.most", { label: "The level I’ll spend the most time on", ph: "Level 2" });
    const rows = LV.map((lv, i) => h("div", { class: "card" },
      h("div", { class: "cols", style: { "--min": "220px" } },
        h("div", null, eyebrow("Level " + (i + 1)), h("h3", null, lv[0])),
        checks("lvl." + i, lv[1], { onChange: paint }))));
    paint();
    return [...rows, res, lineFld,
      bar("**Still go in order.** Levels 1 and 2 are the base for everything after. If Level 3 or 4 has the most checks, take a quick pass through the first two, then slow down when you get there.")];
  } });

<script>
"use strict";
/* ============ shared pieces for lists and systems ============ */
const AREAS = [["Home", "Cleaning, laundry, clutter"], ["Meals", "Planning, groceries, cooking"], ["Money", "Bills, budget, paperwork"],
  ["Kids and family", "School, activities, schedules"], ["Work or business", "Tasks, projects, deadlines"],
  ["Health and movement", "Sleep, exercise, appointments"], ["Relationships", "Partner, friends, family time"], ["Rest and fun", "Hobbies, downtime, things I enjoy"]];
const SNAGS = [["No clear time", "It never has a spot in my week.", "give it a calendar block."], ["No reminder", "I only think of it when it’s already late.", "tie it to something you already do."],
  ["Too many steps", "It feels big, so I put it off.", "cut it down to 3 steps."], ["No home", "The stuff or the info has no set place.", "pick one spot and keep it there."]];
const builderName = n => get("sb." + n + ".name");
const builderNames = () => [1, 2, 3].map(builderName).filter(Boolean);
const focusNames = () => [1, 2, 3].map(n => get("focus." + n + ".name")).filter(Boolean);

/* ===== lists you can use, not just read =====
   Every library list can be made yours (cross out, add your own), worked one item at a time,
   picked from for you, and copied into a phone, computer, or planner. */
const LIBREG = {};
/* the items on a list the way this person sees them: crossed-out ones gone, their own added */
function cardItems(o) {
  const id = o.id, out = [];
  let idx = 0;
  (o.groups || [{ items: o.items }]).forEach(g => g.items.forEach(t => {
    const i = idx++;
    if (!get("cl." + id + ".x." + i)) out.push({ key: "cl." + id + ".c." + i, t, g: g.h || "" });
  }));
  for (let n = 0; n < 6; n++) {
    const t = String(get("cl." + id + ".a." + n + ".t") || "").trim();
    if (t) out.push({ key: "cl." + id + ".a." + n + ".c", t, g: "MY OWN" });
  }
  return out;
}
function checklistText(o, boxes) {
  const items = cardItems(o), lines = [o.title];
  let g = null;
  items.forEach(it => { if (it.g && it.g !== g) { g = it.g; lines.push("", it.g); } lines.push((boxes ? "☐ " : "") + it.t); });
  return lines.join("\n");
}
function checklistCard(o) {
  LIBREG[o.id] = o;
  const id = o.id;
  if (o.daily && get("cl." + id + ".d") !== today()) {
    Object.keys(S).forEach(x => { if (x.startsWith("cl." + id + ".c.") || (x.startsWith("cl." + id + ".a.") && x.endsWith(".c"))) delete S[x]; });
    set("cl." + id + ".d", today());
  }
  let mode = o.startMode || "view", at = 0;
  const body = h("div", { class: "cl strike" }), tools = h("div", { class: "row cl-tools" });
  const pickBox = h("div", { class: "res", hidden: true });
  const cnt = h("span"), clr = link("Clear checks", () => { cardItems(o).forEach(it => set(it.key, false)); draw(); });
  const foot = h("div", { class: "cl-foot" }, cnt, h("span", { class: "row" },
    link("Copy checklist", () => copyText(checklistText(o, true))), link("Copy for my task app", () => copyText(cardItems(o).map(it => it.t).join("\n"))), clr));
  function counts() {
    const items = cardItems(o), n = items.filter(it => get(it.key)).length;
    cnt.textContent = n + " of " + items.length + (o.daily ? " · fresh each day" : "");
    clr.hidden = !n;
  }
  function doPick() {
    const open = cardItems(o).filter(it => !get(it.key));
    pickBox.hidden = false;
    if (!open.length) { pickBox.replaceChildren(p("Everything on this list is done. That counts.")); return; }
    const it = open[Math.floor(Math.random() * open.length)];
    pickBox.replaceChildren(eyebrow("Do this one"), h("p", { class: "one-t" }, it.t),
      h("div", { class: "row" }, btn("I’ll do it", () => { set(it.key, 1); pickBox.hidden = true; draw(); }, "sm"), btn("Pick another", doPick, "ghost sm")));
  }
  function drawOne(items) {
    if (!items.length) { body.append(p("This list is empty. Use Edit list to add your own.", "muted")); return; }
    if (at >= items.length) {
      body.append(h("div", { class: "res" }, p("**That’s the whole list.** Nice work."), h("div", { class: "row" }, btn("Back to the list", () => { mode = "view"; draw(); }, "sm"))));
      return;
    }
    const it = items[at];
    body.append(h("div", { class: "stack" }, h("div", { class: "track" }, h("i", { style: { width: Math.round(at / items.length * 100) + "%" } })), eyebrow("Item " + (at + 1) + " of " + items.length),
      h("p", { class: "one-t" }, it.t),
      h("div", { class: "row" }, btn("Done", () => { set(it.key, 1); at++; draw(); }), btn("Skip", () => { at++; draw(); }, "ghost"), at > 0 ? btn("Back", () => { at--; draw(); }, "ghost sm") : null),
      link("Back to the list", () => { mode = "view"; draw(); })));
  }
  function drawEdit() {
    let idx = 0;
    (o.groups || [{ items: o.items }]).forEach(g => {
      if (g.h) body.append(h("div", { class: "grp" }, g.h));
      g.items.forEach(t => {
        const i = idx++, xk = "cl." + id + ".x." + i;
        const b = btn(get(xk) ? "Put back" : "Cross out", () => { const on = !get(xk); set(xk, on ? 1 : false); row.classList.toggle("crossed", on); b.textContent = on ? "Put back" : "Cross out"; }, "ghost sm");
        const row = h("div", { class: "editrow" + (get(xk) ? " crossed" : "") }, h("span", null, t), b);
        body.append(row);
      });
    });
    body.append(h("div", { class: "grp" }, "Add my own"));
    for (let n = 0; n < 6; n++) body.append(cellInput("cl." + id + ".a." + n + ".t", { aria: "My own item " + (n + 1), ph: "Add your own" }));
    body.append(h("div", { class: "row" }, btn("Done editing", () => { mode = "view"; draw(); }, "sm")));
  }
  function draw() {
    body.replaceChildren(); tools.replaceChildren();
    const items = cardItems(o);
    counts();
    foot.hidden = mode !== "view";
    if (mode === "one") { drawOne(items); return; }
    if (mode === "edit") { tools.append(p("Cross out what does not fit your life. Add your own below.", "muted small")); drawEdit(); return; }
    tools.append(btn("One at a time", () => { at = Math.max(0, items.findIndex(it => !get(it.key))); mode = "one"; pickBox.hidden = true; draw(); }, "ghost sm"),
      o.pick ? btn("Pick one for me", doPick, "ghost sm") : null, btn("Make it mine", () => { mode = "edit"; pickBox.hidden = true; draw(); }, "ghost sm"));
    let g = null;
    items.forEach(it => {
      if (it.g && it.g !== g) { g = it.g; body.append(h("div", { class: "grp" }, it.g)); }
      body.append(chkEl(it.key, it.t, { onChange: counts }));
    });
  }
  draw();
  return card({ id, cls: o.tone === "tint" ? "" : "out", badge: o.badge, badgeCls: o.badge === "Yours" ? "you" : "", title: o.title, h: "h3", sub: o.sub,
    kids: [tools, pickBox, body, o.after ? p(o.after, "small") : null, foot] });
}
/* a card of blank lines with tick boxes, rows can be added */
function customList(id, o = {}) {
  const max = o.max || 20, nk = "cx." + id + ".n";
  const tk = i => o.textKey ? o.textKey(i) : "cx." + id + "." + i + ".t";
  const box = h("div", { class: "stack tight" });
  const draw = () => {
    box.replaceChildren();
    const n = Number(get(nk, o.n || 6));
    for (let i = 0; i < n; i++) {
      const inp = cellInput(tk(i), { aria: "List item " + (i + 1) });
      box.append(chkEl("cx." + id + "." + i + ".c", inp, { cls: "line" }));
    }
  };
  draw();
  const copyIt = () => {
    const n = Number(get(nk, o.n || 6)), lines = [];
    for (let i = 0; i < n; i++) { const t = String(get(tk(i)) || "").trim(); if (t) lines.push("☐ " + t); }
    copyText([get("cx." + id + ".title") ? "When I feel " + get("cx." + id + ".title") : (o.title || "My list")].concat(lines).join("\n"));
  };
  const add = o.fixed ? null : btn("Add a row", () => { const n = Number(get(nk, o.n || 6)); if (n < max) { set(nk, n + 1); draw(); } }, "ghost sm");
  return card({ id, cls: o.tone === "tint" ? "" : "out", badge: o.badge, badgeCls: o.badge === "Yours" ? "you" : "", title: o.title, h: "h3", sub: o.sub,
    kids: [o.titleLabel ? field("cx." + id + ".title", { label: o.titleLabel, cls: "inl" }) : null, o.useLabel ? field("cx." + id + ".use", { label: o.useLabel, cls: "inl" }) : null, box,
      h("div", { class: "row" }, add, link("Copy my list", copyIt))] });
}
/* a two-column library page */
function libPage(left, right) { return h("div", { class: "libcols" }, h("div", { class: "libcol" }, ...left), h("div", { class: "libcol" }, ...right)); }

/* ============ LEVEL 3 ============ */

    const k = "sb." + n + ".", steps = [0, 1, 2, 3, 4].map(i => v(k + "step." + i)).filter(Boolean).map((s, i) => (i + 1) + ". " + s).join("\n");

  }));

  add("My systems at a glance", "l4-glance", gl);
  return out;
}
function summaryText() {

}
function backupCode() { return "SFRL1:" + btoa(unescape(encodeURIComponent(JSON.stringify(S)))); }
function restoreFrom(text) {
  try {
    let t = String(text).trim();
    const obj = JSON.parse(t.startsWith("SFRL1:") ? decodeURIComponent(escape(atob(t.slice(6)))) : t);
    if (!obj || typeof obj !== "object" || Array.isArray(obj)) throw new Error("shape");
    S = obj; flush(); refreshChrome(); nav("workbook"); toast("Your answers are back"); return true;
  } catch (e) { toast("That backup code did not work. Check that you copied all of it."); return false; }
}
function renderWorkbook() {

  return h("article", { class: "lesson" },

    h("div", { class: "wrap" }, h("div", { class: "body" },
      secs.length ? secs.map(s => h("section", { class: "sec" }, h("div", { class: "row", style: { justifyContent: "space-between" } }, h("h2", null, s.title), link("Edit", () => nav(s.lessonId))),
        h("dl", { class: "dl" }, s.rows.map(r => [h("dt", null, r[0]), h("dd", null, r[1])]).flat())))
        : bar("Nothing here yet. Chat with your assistant for five minutes and your system shows up here.", { extra: btn("Open my assistant", () => nav("home"), "sm") }),
      h("hr", { class: "hr" }),

      sec("Keep a copy", p("Your answers are saved in this browser on this device. A backup lets you move them to a new phone or computer, or keep them safe.", "muted"),
        h("div", { class: "row" }, btn("Copy my system as text", () => copyText(summaryText()), "ghost"), DL ? btn("Save it as a file", () => saveFile("my-systems-for-real-life.txt", summaryText()), "ghost") : null),
        h("div", { class: "row" }, btn("Copy my backup code", () => copyText(backupCode())), DL ? btn("Save a backup file", () => saveFile("systems-for-real-life-backup.json", JSON.stringify(S, null, 2)), "ghost") : null)),
      sec("Restore a backup", code, h("div", { class: "row" }, btn("Restore from this code", () => restoreFrom(code.value), "ghost sm"), h("label", { class: "small muted" }, "Or choose a backup file: ", file))),
      sec("Start over", p("This erases every answer and check mark on this device. Copy a backup first if you might want them back.", "muted"),
        h("div", null, confirmBtn("Erase everything", "Tap again to erase everything", () => { S = {}; flush(); refreshChrome(); nav("home"); toast("All clear"); }))),
      legal()))
  );
}

lesson("cp", { id: "cp-tracker", title: "4-Week Tracker", tag: "Consistency Pack · 4 weeks", desc: "Color a box any day you did the floor or more.",

    const paintCmp = () => {
      const a = total(1), b = total(2);
      cmp.replaceChildren(h("div", { class: "row" }, h("span", { class: "pill" }, "Round 1: " + a + " boxes"), h("span", { class: "pill" }, "Round 2: " + b + " boxes")),
        p(a && b ? (b > a ? "**Round 2 has " + (b - a) + " more colored boxes.** More than last month means it’s working." : b === a ? "**Same number of boxes in both rounds.** Showing up the same way twice is a win." : "**Round 1 had more boxes.** That’s okay. Pick your floor again and start the next round small.")
          : "Color some boxes in both rounds to see how they compare.", "small"));
    };
    const habit = (r, hb) => {
      const k = "tr." + r + "." + hb + ".", cnt = h("span", { class: "pill" });
      const upd = () => { let n = 0; for (let w = 1; w <= 4; w++) for (let d = 0; d < 7; d++) if (get(k + w + "." + d)) n++; cnt.textContent = n + " boxes colored"; paintCmp(); };
      const g = h("div", { class: "trk" }, h("span"), ...D.map(x => h("span", { class: "hd" }, x)));
      for (let w = 1; w <= 4; w++) { g.append(h("span", { class: "wk" }, "Wk " + w)); for (let d = 0; d < 7; d++) g.append(tg(k + w + "." + d, { aria: "Habit " + hb + " week " + w + " " + D[d], onChange: upd })); }
      let n = 0; for (let w = 1; w <= 4; w++) for (let d = 0; d < 7; d++) if (get(k + w + "." + d)) n++; cnt.textContent = n + " boxes colored";
      return card({ cls: "out", kids: [h("div", { class: "cols", style: { "--min": "220px" } }, field(k + "name", { label: "Habit " + hb, def: get("fam." + (hb - 1) + ".h") }), field(k + "floor", { label: "My floor", def: get("fam." + (hb - 1) + ".f") })), g, cnt] });
    };
    paintCmp();
    return [tabs("tr", ["Round 1 of 2", "Round 2 of 2"], [1, 2].map(r => stack(...[1, 2, 3].map(hb => habit(r, hb))))), cmp,
      bar("**What to look for:** count the boxes you colored, and leave the blank ones out of the math. More colored boxes than last month means it’s working.")];
  } });

<script>
"use strict";
/* ============ printable plan (PDF) ============
   Page scripts cannot open the print dialog, so the plan is built as a real PDF in the page and
   handed to the viewer to save. People print it, or keep it on their phone. Blank answers print
   as ruled lines so the sheet still works by hand. */
const PLAN_JS = "https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js";
let jsPdfP = null;
function loadJsPDF() {
  if (window.jspdf && window.jspdf.jsPDF) return Promise.resolve(window.jspdf.jsPDF);
  if (!jsPdfP) jsPdfP = new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = PLAN_JS;
    s.onload = () => (window.jspdf && window.jspdf.jsPDF) ? res(window.jspdf.jsPDF) : rej(new Error("jsPDF missing"));
    s.onerror = () => { jsPdfP = null; rej(new Error("jsPDF did not load")); };
    document.head.append(s);
  });
  return jsPdfP;
}

const PLAN_RHYTHM = [["Weekly reset", "Empty the inbox and look back at last week."], ["Weekly plan", "Check the calendar and choose your priorities."],
  ["Daily plan", "Look at today and pull your top 3."], ["Do the work", "One thing at a time. New stuff goes to the inbox."],
  ["Evening review", "Note your wins and move what’s left."], ["Repeat", "Keep what worked. Change one thing."]];
const PLAN_EXCUSES = [["“I’ll do it tomorrow.”", "I do the floor version right now. It takes 5 minutes, and tomorrow gets easier."], ["“I already missed a few days.”", "Today is day one again. I do today’s floor and keep going."],
  ["“I don’t have time for the whole thing.”", "I do the floor. The whole thing can wait for a bigger day."], ["“I need to plan it all out first.”", "I take the next step with what I know. The plan can fill in as I go."],
  ["“I’m too tired.”", "I do the smallest version, then rest. Both count."]];

function buildPlan(JS) {
  const doc = new JS({ unit: "pt", format: "letter", compress: true });
  const reg = (file, data, fam, style) => { doc.addFileToVFS(file, data); doc.addFont(file, fam, style); };
  reg("is400.ttf", FONT.sans, "ISans", "normal"); reg("is600.ttf", FONT.sansb, "ISans", "bold");
  reg("iserif.ttf", FONT.serif, "ISerif", "normal"); reg("iserifi.ttf", FONT.serifi, "ISerif", "italic");
  doc.setProperties({ title: "My real life system", subject: APP_NAME, creator: "wendaful.com" });

  const W = 612, H = 792, M = 46, CW = W - 2 * M, TOTAL = 3, LH = 17;
  const C = { green: [84, 100, 91], light: [218, 223, 220], ink: [55, 58, 64], gray: [84, 84, 84], warm: [244, 241, 237], rule: [188, 184, 176], white: [255, 255, 255] };
  const val = k => String(get(k) || "").trim();
  const font = (f, st, size, col) => { doc.setFont(f, st); doc.setFontSize(size); doc.setTextColor(col[0], col[1], col[2]); };
  const txt = (s, x, y, o) => doc.text(String(s), x, y, o);
  const rule = (x1, y, x2, col, lw) => { const c = col || C.rule; doc.setDrawColor(c[0], c[1], c[2]); doc.setLineWidth(lw || 0.6); doc.line(x1, y, x2, y); };
  const fillRect = (x, y, w, h, col) => { doc.setFillColor(col[0], col[1], col[2]); doc.rect(x, y, w, h, "F"); };
  const cap = (s, x, y, col, o) => { font("ISans", "bold", 6.6, col || C.gray); txt(String(s).toUpperCase(), x, y, Object.assign({ charSpace: 0.8 }, o || {})); };
  const fit = (s, w, max) => {
    const ls = doc.splitTextToSize(String(s), w);
    if (ls.length <= max) return ls;
    const cut = ls.slice(0, max); cut[max - 1] = cut[max - 1].replace(/[\s,.;:]*\S*$/, "") + "…"; return cut;
  };
  /* n ruled lines with your words written on them */
  const ruled = (x, y, w, value, n, size) => {
    font("ISerif", "italic", size || 12, C.green);
    const ls = value ? fit(value, w - 3, n) : [];
    for (let i = 0; i < n; i++) {
      const ly = y + (i + 1) * LH;
      if (ls[i]) { font("ISerif", "italic", size || 12, C.green); txt(ls[i], x + 1.5, ly - 4.2); }
      rule(x, ly, x + w);
    }

<script>
"use strict";
/* ============ fold related pages into one step ============
   Each guide in a level is one page with a few short parts, instead of a pile of extra pages.
   The old page ids still work as links: they open the step and scroll to the right part. */
const ABSORBED = {}, ALIAS = {};
function mergeInto(baseId, o) {
  const orig = {};
  o.parts.forEach(q => { orig[q.id] = BYID[q.id]; if (!orig[q.id]) throw new Error("merge: missing " + q.id); });
  const base = BYID[baseId];
  const parts = o.parts.map(q => ({ id: q.id, h: q.h || orig[q.id].title, lede: q.lede !== undefined ? q.lede : orig[q.id].lede, build: orig[q.id].build }));
  o.parts.forEach(q => {
    if (q.id === baseId) return;
    const d = orig[q.id];
    const i = LESSONS.indexOf(d); if (i >= 0) LESSONS.splice(i, 1);
    const j = d.mod.lessons.indexOf(d); if (j >= 0) d.mod.lessons.splice(j, 1);
    delete BYID[d.id]; ABSORBED[d.id] = d; ALIAS[d.id] = { id: baseId, focus: "part-" + d.id };
  });
  if (o.title) base.title = o.title;
  if (o.tag) base.tag = o.tag;
  if (o.desc) base.desc = o.desc;
  base.lede = o.lede;
  base.build = () => {
    const secs = parts.map((b, i) => h("section", { class: "sec part", "data-card": "part-" + b.id },
      eyebrow("Part " + (i + 1) + " of " + parts.length), h("h2", null, b.h), b.lede ? p(b.lede) : null,
      h("div", { class: "part-body" }, ...[].concat(b.build()))));
    const jump = h("div", { class: "row" }, eyebrow("On this page"), ...parts.map(b => h("button", { type: "button", class: "chip ex",
      onclick: () => { const t = elMain.querySelector('[data-card="part-' + b.id + '"]'); if (t) t.scrollIntoView({ block: "start" }); } }, b.h)));
    return [jump, ...secs, o.after ? o.after() : null];
  };
  LESSONS.forEach((l, k) => { l.idx = k; });
}
/* add something to the end of a page that is not merged */
function appendTo(id, fn) { const l = BYID[id], b = l.build; l.build = () => [].concat(b(), fn()); }
const toolbox = (text, links) => card({ title: "From the toolbox", h: "h4", sub: text, kids: [h("div", { class: "row" }, ...links.map(l => btn(l[0], () => nav(l[1]), "ghost sm")))] });

const HUB = [["High energy and ready to work", "he", "lib-energy"], ["Low energy, barely moving", "le", "lib-energy"], ["Overwhelmed and frozen", "frozen", "lib-hard"],
  ["Too full in the head to think", "brain", "lib-hard"], ["Ready for a soft, slow day", "soft", "lib-hard"], ["It’s a content day", "flow", "lib-content"],
  ["In need of a reset", "reset", "lib-content"], ["Like it’s a normal day", "morning", "lib-daily"]];
function libraryHub() {
  const root = h("div", { class: "stack" }), dk = () => "myday." + today();
  const getDay = () => { const v = get(dk(), []); return Array.isArray(v) ? v.map(x => ({ t: x.t, c: !!x.c })) : []; };
  const setDay = a => set(dk(), a.length ? a : false);
  const menuBox = h("div", { class: "stack" }), dayBox = h("div", { class: "stack" });
  const feel = chips("hub.feel", HUB.map(x => x[0]), { label: "What kind of day is this?", onChange: () => drawMenu() });
  function drawMenu() {
    menuBox.replaceChildren();
    const e = HUB.find(x => x[0] === get("hub.feel")); if (!e) return;
    if (!LIBREG[e[1]]) BYID[e[2]].build();
    const o = LIBREG[e[1]], items = cardItems(o);
    const has = t => getDay().some(x => x.t === t);
    const add = t => { if (has(t)) return; const d = getDay(); d.push({ t, c: false }); setDay(d); drawDay(); drawMenu(); };
    menuBox.append(h("div", { class: "stack" }, p("**" + o.title + ".** " + (o.sub || "") + " Tap what you want to do today.", "muted"),
      h("div", { class: "chips" }, ...items.map(it => h("button", { type: "button", class: "chip ex", "aria-pressed": has(it.t) ? "true" : "false", onclick: () => add(it.t) }, it.t))),
      h("div", { class: "row" }, btn("Pick one for me", () => { const open = items.filter(it => !has(it.t)); if (!open.length) { toast("Everything from this list is already on your day."); return; } add(open[Math.floor(Math.random() * open.length)].t); }, "ghost sm"),
        link("See the whole list", () => nav(e[2], { focus: e[1] })))));
  }
  function drawDay() {
    dayBox.replaceChildren();
    const d = getDay(), done = d.filter(x => x.c).length;
    const list = h("div", { class: "strike" });
    d.forEach((it, i) => {
      const inp = h("input", { type: "checkbox" }); inp.checked = it.c;
      inp.addEventListener("change", () => { const x = getDay(); x[i].c = inp.checked; setDay(x); drawDay(); });
      list.append(h("div", { class: "editrow" }, h("label", { class: "chk" }, inp, h("span", { class: "box", "aria-hidden": "true" }), h("span", { class: "lbl" }, it.t)),
        link("Remove", () => { const x = getDay(); x.splice(i, 1); setDay(x); drawDay(); drawMenu(); })));
    });
    const mine = cellInput("hub.own", { aria: "Add my own thing", ph: "Add my own" });
    mine.addEventListener("keydown", e => { if (e.key === "Enter") addOwn(); });
    const addOwn = () => { const t = mine.value.trim(); if (!t) return; const x = getDay(); x.push({ t, c: false }); setDay(x); mine.value = ""; set("hub.own", ""); drawDay(); };
    dayBox.append(card({ cls: "out", title: "My day", h: "h3", sub: d.length ? done + " of " + d.length + " done. Starts fresh tomorrow." : "Tap things above and they land here. One to three is plenty.",
      kids: [d.length ? list : null, h("div", { class: "row" }, mine, btn("Add", addOwn, "ghost sm")),
        h("div", { class: "row" }, btn("Copy for my planner or phone", () => copyText("My day\n" + d.map(x => "☐ " + x.t).join("\n")), "sm"), d.length ? link("Clear my day", () => { setDay([]); drawDay(); drawMenu(); }) : null)] }));
    if (d.length && done === d.length) dayBox.append(bar("**Nice.** You picked a few things and did them. The day counts.", { cls: "good" }));
  }
  drawMenu(); drawDay();
  root.append(feel, menuBox, dayBox);
  return root;
}

/* ============ Today: the daily page ============ */
function renderToday() {
  const T = today(), TM = dayPlus(1), WK = weekKey(), hour = new Date().getHours(), name = get("name");
  const hi = (hour < 12 ? "Good morning" : hour < 18 ? "Good afternoon" : "Good evening") + (name ? ", " + name : "") + ".";

    const next = top.find(i => !get("top." + T + "." + i + ".c"));

  };
  const art = h("article", { class: "lesson" }), body = h("div", { class: "body" });

  const coachCard = h("div", { class: "coach" }, avatar(), h("div", { class: "stack tight" }, eyebrow("Wenda says"), line,
    isSortDay() ? p("**Today is your sort day.** Ten minutes: empty your inbox into your calendar, tasks, and notes.") : null,
    isSortDay() ? h("div", null, btn("Open my sort steps", () => nav("l1-route", { focus: "part-l1-route" }), "ghost sm")) : null));

  const just = get("night.just").replace(/^\s*(just\s+)?(i['’]?ll\s+|i['’]m going to\s+|i am going to\s+)?/i, "").trim();
  const fl0 = habits.length ? get("fam." + habits[0] + ".f") : "";
  const justCard = (just || fl0) ? card({ cls: "out", eyebrow: "If I don’t feel like it", title: just ? "I’m just going to " + just + "." : "My floor today: " + fl0, h: "h3",
    kids: [p("No talking myself out of it. Starting is the win, and I usually end up doing more. Anything more is a bonus.", "muted")] }) : null;

  const topCard = (() => {
    const rows = h("div", { class: "stack tight" });
    for (let i = 0; i < 3; i++) rows.append(chkEl("top." + T + "." + i + ".c", cellInput("top." + T + "." + i + ".t", { aria: "Top " + (i + 1), ph: i === 0 ? "The one thing I’ll do first" : "", onInput: paint }), { cls: "line", onChange: paint }));
    return card({ cls: "out", title: "My top 3 today", h: "h3", sub: "Pick them this morning or last night. Everything after these is a bonus.",
      kids: [rows, h("div", { class: "row" }, btn("Copy for my planner or phone", () => copyText("Top 3 for today\n" + [0, 1, 2].map(i => get("top." + T + "." + i + ".t")).filter(Boolean).map(t => "☐ " + t).join("\n")), "ghost sm"))] });
  })();

  const floorCard = (() => {
    if (!habits.length) return card({ title: "My floor today", h: "h3", sub: "Add a habit and its floor on the Your floor step. Then you can check it off here.", kids: [h("div", null, btn("Build my floor", () => nav("l3-floor"), "sm"))] });
    const rows = h("div", { class: "stack" });
    habits.forEach(i => {
      const k = "fl." + T + "." + i, SZ = [["F", "Floor"], ["R", "Regular"], ["B", "Bonus"]];
      const btns = SZ.map(s => { const b = h("button", { type: "button", class: "tg r", "aria-label": get("fam." + i + ".h") + " " + s[1], "aria-pressed": get(k) === s[0] ? "true" : "false" }, s[0]);
        b.addEventListener("click", () => { set(k, get(k) === s[0] ? "" : s[0]); btns.forEach((x, j) => x.setAttribute("aria-pressed", get(k) === SZ[j][0] ? "true" : "false")); paint(); }); return b; });
      rows.append(h("div", { class: "row", style: { justifyContent: "space-between" } }, h("div", null, h("strong", null, get("fam." + i + ".h")), h("div", { class: "muted small" }, "Floor: " + (get("fam." + i + ".f") || "not set yet"))), h("div", { class: "row" }, ...btns)));

  })();

  const mvd = [0, 1, 2, 3, 4].filter(i => get("mvd." + i));

    kids: [h("div", { class: "strike" }, ...mvd.map(i => chkEl("mvdt." + T + "." + i, get("mvd." + i), {})))] }) : null;

  const myDay = Array.isArray(get("myday." + T, [])) ? get("myday." + T, []) : [];
  const dayCard = card({ title: "My day menu", h: "h3", sub: myDay.length ? myDay.filter(x => x.c).length + " of " + myDay.length + " done from the menu." : "Low on energy? Pick one to three things from a menu instead of deciding.",

  const nightItems = [0, 1, 2, 3].filter(i => get("night." + i));
  const tomorrow = h("div", { class: "stack tight" });

  const eveCard = card({ cls: "out", title: "Evening review", h: "h3", sub: "Two minutes. Then you’re done.", kids: [
    nightItems.length ? h("div", { class: "stack tight" }, h("span", { class: "lbl" }, "Tonight I’m setting up"), h("div", { class: "strike" }, ...nightItems.map(i => chkEl("nt." + T + "." + i, get("night." + i), {})))) : p("Decide tomorrow’s choices tonight. Pick your setup on the Your floor step.", "muted small"),
    field("win." + T, { label: "One win from today" }), field("let." + T, { label: "What I’ll move or let go" }),
    h("div", { class: "fld" }, h("div", { class: "lbl" }, "Tomorrow’s top 3"), tomorrow)] });

  const wk = "wc." + WK + ".", reply = h("div", { class: "stack tight" });
  const drawReply = () => {
    reply.replaceChildren();
    const v = get(wk + "how");
    if (v === "It went great") reply.append(p("**Notice what helped.** Write it down below, keep it, and change nothing else this week."));
    else if (v === "It went okay") reply.append(p("**Okay is good.** Pick one small thing to make easier next week. Just one."));
    else if (v === "It was a rough one") reply.append(p("**Rough weeks happen to everyone, me included.** Today is day one again. Do your floor, then pick it back up with the smallest piece."),
      h("div", { class: "row" }, btn("After a rough week", () => nav("l3-excuse", { focus: "part-l3-rough" }), "sm"), btn("Day One Again", () => nav("cp-dayone"), "ghost sm")));
  };
  drawReply();
  const weekCard = card({ cls: "out", title: "Weekly check-in", h: "h3", sub: "Once a week, look back for two minutes. No grading.", kids: [
    chips(wk + "how", ["It went great", "It went okay", "It was a rough one"], { label: "How did this week go?", onChange: drawReply }), reply,
    field(wk + "worked", { label: "What worked" }), field(wk + "change", { label: "One thing to change" }), checks(wk + "reset", ["I did my weekly reset"], {})] });

  const nextCard = (() => { const c = continueTarget(); return card({ title: "Want to know why this works?", h: "h4", text: c.title + (COACH[c.id] ? ". " + COACH[c.id].now : ""), kids: [h("div", null, btn("Read the next guide", () => nav(c.id), "ghost sm"))] }); })();

  const order = hour >= 17 ? [coachCard, eveCard, justCard, topCard, floorCard, mvdCard, dayCard, weekCard, nextCard]
    : isSortDay() ? [coachCard, justCard, topCard, floorCard, mvdCard, dayCard, weekCard, eveCard, nextCard]
    : [coachCard, justCard, topCard, floorCard, mvdCard, dayCard, eveCard, weekCard, nextCard];
  order.filter(Boolean).forEach(x => body.append(x));
  paint();
  art.append(h("div", { class: "wrap" }, strip(APP_NAME, "Today"),
    h("div", { class: "head" }, eyebrow(new Date().toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" })), h("h1", { class: "h1" }, hi),
      p("Your daily page. Pick your top 3, do your floor, close the day. Everything is decided, so there is nothing to talk yourself out of.", "lede"))),
    h("div", { class: "wrap" }, body));
  return art;
}
