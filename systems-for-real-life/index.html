<script>
"use strict";
/* ============ the assistant ============
   The front door. It asks a few tap-to-answer questions, builds the whole system for the person
   (4 parts, sort time, first system, floor, night-before list, minimum viable day), then helps
   them set it up and keep going. Every answer is saved in the same places the method pages use,
   so everything shows up in My system, Today, and the printable plan. */
const REDUCED = typeof matchMedia === "function" && matchMedia("(prefers-reduced-motion: reduce)").matches;
const wait = ms => new Promise(r => setTimeout(r, REDUCED ? 0 : ms));

const HABITS = [
  { name: "Move my body", f: "Shoes on, 5 minutes", r: "20 minutes", b: "45 minutes", just: "put my shoes on and do one loop around the neighborhood", night: ["Set out my clothes", "Fill my water bottle", "Plan my meal"] },
  { name: "Tidy up", f: "Wipe one counter", r: "One zone, 10 minutes", b: "The whole room", just: "wipe one counter", night: ["Clear the sink", "Plan my meal", "Write tomorrow’s top 3"] },
  { name: "Post content", f: "Post one thing, anything", r: "Film one short video", b: "Batch a week of content", just: "post one thing, anything", night: ["Pick tomorrow’s idea", "Charge my camera", "Write tomorrow’s top 3"] },
  { name: "Plan my day", f: "Pick one task", r: "Write my top 3", b: "Time-block the whole day", just: "pick one task", night: ["Write tomorrow’s top 3", "Check tomorrow’s calendar", "Set out what I need"] },
  { name: "Laundry", f: "Wash and dry, fold tomorrow", r: "One load a day", b: "All the laundry, start to finish", just: "start one load", night: ["Plan my meal", "Charge my phone", "Write tomorrow’s top 3"] },
  { name: "Read", f: "One page", r: "20 minutes", b: "An hour with tea", just: "read one page", night: ["Put my book by my bed", "Charge my phone", "Write tomorrow’s top 3"] }
];
const MVD_STARTER = ["Drink water", "Write my top 3 in my planner", "Do one deep work task", "Move my body for 20 minutes", "Quick tidy before bed"];

/* the tools a person can pick. Each tool gets one job. */
const TOOL_OPTS = [["Paper planner", "planner"], ["Digital calendar", "dcal"], ["Wall calendar", "wall"], ["Task or project app", "tasks"], ["Notes app", "notes"]];
const TOOL_DEFAULT = ["planner", "dcal", "tasks"];
const toolsUsed = () => TOOL_OPTS.map(o => o[1]).filter(id => get("tools.use." + id));
/* where each part lives, chosen from the tools the person uses */
function homesFor(T) {
  const has = x => T.includes(x), P = has("planner");
  return {
    inbox: P ? "A brain dump page in my planner" : has("notes") ? "A note called Inbox in my notes app" : has("tasks") ? "An Inbox list in my task app" : "A notebook page I call Inbox",
    cal: has("dcal") ? (has("wall") ? "A digital calendar, copied to our wall calendar each week" : P ? "A digital calendar, copied into my planner each week" : "A digital calendar")
      : has("wall") ? "A wall calendar" : "The weekly pages in my planner",
    tasks: has("tasks") ? (P ? "A task app, with my top 3 copied into my planner" : "A task app") : P ? "A task list page in my planner" : has("notes") ? "A checklist in my notes app" : "A to-do list in a notebook",
    notes: has("notes") ? "A notes app with folders" : P ? "A notes section at the back of my planner" : "A notebook just for info"
  };
}
function ideasFor(area) {
  const a = IDEAS_A.filter(x => x[0] === area).map(x => idea(x[1], x[0], x[2], ""));
  const b = IDEAS_B.filter(x => x[1] === area).map(x => idea(x[2], x[1], x[3], x[4]));
  const out = a.concat(b);
  return out.length ? out : IDEAS_A.map(x => idea(x[1], x[0], x[2], ""));
}
function applySystem(n, d) {
  const k = "sb." + n + ".";
  clearPrefix(k);
  set(k + "name", d.name); set(k + "area", d.area); set(k + "decision", "Deciding what to do each time");
  d.steps.slice(0, 5).forEach((s, i) => set(k + "step." + i, s));
  set(k + "low", d.low || "Just step 1: " + d.steps[0]);
}
function ideaCard(d) {
  return card({ cls: "out", eyebrow: d.area, title: d.name, h: "h3", kids: [h("ol", { class: "stack tight" }, d.steps.slice(0, 5).map((s, i) => h("li", { class: "num solid" }, h("span", { class: "n" }, String(i + 1)), h("span", null, s)))),
    p("**On a tired day:** " + (d.low || "just step 1."), "muted small")] });
}
function addToDay(t) { const k = "myday." + today(); const v = Array.isArray(get(k, [])) ? get(k, []).slice() : []; if (!v.some(x => x.t === t)) v.push({ t, c: false }); set(k, v); }
const asstAnswered = id => !!get("asst.done." + id);

/* ============ chat engine ============ */
function createChat(root) {
  const log = h("div", { class: "chat-log", "aria-live": "polite" }), dock = h("div", { class: "chat-dock" });
  root.append(log, dock);
  const c = { fast: false };
  const alive = () => root.isConnected;
  const toEnd = el => {
    if (el && el.offsetHeight > elMain.clientHeight * 0.55) elMain.scrollTop += el.getBoundingClientRect().top - elMain.getBoundingClientRect().top - 12;
    else elMain.scrollTop = elMain.scrollHeight;
  };
  const av = () => h("div", { class: "coach-av sm", "aria-hidden": "true" }, "W");
  c.alive = alive;
  c.say = async (...items) => {
    for (const it of items) {
      if (!alive() || c.fast || it == null) continue;
      const typing = h("div", { class: "cm a" }, av(), h("div", { class: "bubble typing", "aria-hidden": "true" }, h("i"), h("i"), h("i")));
      log.append(typing); toEnd();
      await wait(Math.min(850, 300 + (typeof it === "string" ? it.length * 7 : 200)));
      typing.remove();
      if (!alive()) return;
      const msg = typeof it === "string" ? h("div", { class: "cm a" }, av(), h("div", { class: "bubble" }, rt(it))) : h("div", { class: "cm block" }, it);
      log.append(msg);
      toEnd(msg);
    }
  };
  c.you = text => { if (!c.fast && alive()) { log.append(h("div", { class: "cm u" }, h("div", { class: "bubble" }, text))); toEnd(); } };
  c.ask = cfg => new Promise(resolve => {
    if (c.fast) { resolve(cfg.def !== undefined ? cfg.def : null); return; }
    if (!alive()) return;
    dock.replaceChildren();
    const finish = (val, label) => { dock.replaceChildren(); if (label) c.you(label); resolve(val); };
    const opts = (cfg.options || []).map(o => Array.isArray(o) ? o : [o, o]);
    let body;
    if (cfg.type === "text") {
      const inp = h("input", { class: "ln", type: "text", placeholder: cfg.placeholder || "", "aria-label": cfg.aria || "Your answer", autocomplete: "off" });
      const send = () => { const v = inp.value.trim(); if (v) finish(v, v); };
      inp.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
      body = h("div", { class: "row dockrow" }, inp, btn("Send", send, "sm"), cfg.skip ? btn(cfg.skip, () => finish(null, cfg.skip), "ghost sm") : null);
    } else if (cfg.multi) {
      const picked = new Set(cfg.def || []);
      const btns = opts.map(o => h("button", { type: "button", class: "chip", "aria-pressed": picked.has(o[1]) ? "true" : "false",
        onclick: e => { picked.has(o[1]) ? picked.delete(o[1]) : picked.add(o[1]); e.currentTarget.setAttribute("aria-pressed", picked.has(o[1]) ? "true" : "false"); } }, o[0]));
      body = h("div", { class: "stack tight" }, h("div", { class: "chips" }, ...btns),
        h("div", { class: "row" }, btn(cfg.cont || "Continue", () => finish([...picked], opts.filter(o => picked.has(o[1])).map(o => o[0]).join(", ") || cfg.none || "Not sure"), "sm"),
          cfg.more ? btn(cfg.more, () => finish("__more__", cfg.more), "ghost sm") : null));
    } else {
      body = h("div", { class: "chips" }, ...opts.map(o => h("button", { type: "button", class: "chip" + (o[2] ? " rec" : ""), onclick: () => finish(o[1], o[0]) }, o[0])));
    }
    const foot = cfg.guess === false ? null : h("div", { class: "row" }, link("Use my best guess for the rest", () => { c.fast = true; finish(cfg.def, "Use my best guess"); }));
    dock.append(...[cfg.prompt ? eyebrow(cfg.prompt) : null, body, foot].filter(Boolean));
    toEnd();
    const first = dock.querySelector("input.ln"); if (first) setTimeout(() => first.focus({ preventScroll: true }), 0);
  });
  return c;
}

/* ============ the build conversation ============ */
async function habitFlow(c, idx) {
  const k = "fam." + idx + ".", taken = [0, 1, 2].filter(i => i !== idx).map(i => get("fam." + i + ".h")).filter(Boolean);
  const names = HABITS.map(x => x.name).filter(n => !taken.includes(n));
  const v = await c.ask({ options: names.concat(["Something else"]), def: names[0] });
  let hb = HABITS.find(x => x.name === v);
  if (!hb) {
    await c.say("What’s the habit?");
    const nm = await c.ask({ type: "text", placeholder: "For example: Stretch", aria: "Habit name", skip: "Skip", def: names[0] });
    hb = nm ? { name: nm, f: "Just start for 5 minutes", r: "20 minutes", b: "An hour", just: "start for 5 minutes", night: ["Set out what I need", "Plan my meal", "Write tomorrow’s top 3"] } : HABITS.find(x => x.name === names[0]) || HABITS[0];
  }
  set(k + "h", hb.name); set(k + "f", hb.f); set(k + "r", hb.r); set(k + "b", hb.b); if (idx === 0) set("night.just", hb.just);
  await c.say(idx === 0 ? "Here’s the trick. You only have to do the **floor**. On a hard day, that’s all. Most days you’ll do more once you start." : "Same trick. You only have to do the **floor**.",
    card({ title: hb.name, h: "h3", kids: [h("dl", { class: "dl" }, ...[["Floor", hb.f], ["Regular", hb.r], ["Bonus", hb.b]].map(r => [h("dt", null, r[0]), h("dd", null, r[1])]).flat())] }), "When will you do it?");
  const w = await c.ask({ options: ["In the morning", "In the afternoon", "In the evening", "After work"], def: "In the morning" });
  set(k + "when", (w || "In the morning").toLowerCase()); set(k + "freq", "Every day");
  return hb;
}
async function systemFlow(c, slot) {
  const first = slot === 1;
  if (!first) {
    await c.say("Which part of life should this one help with?");
    const a = await c.ask({ options: AREAS.map(x => x[0]), def: "Home", guess: false });
    set("sb." + slot + ".area", a);
  }
  const area = first ? (get("focus.1.name") || "Home") : get("sb." + slot + ".area");
  const list = ideasFor(area); let i = 0, chosen = null;
  await c.say(first ? "Let’s build one small system for **" + area + "**. Here’s the one I’d start with." : "Here’s one I’d start with for **" + area + "**.");
  for (;;) {
    const d = list[i % list.length];
    await c.say(ideaCard(d));
    const v = await c.ask({ options: list.length > 1 ? ["Use this one", "Show me another", "Skip"] : ["Use this one", "Skip"], def: "Use this one", guess: first });
    if (v === "Show me another") { i++; continue; }
    if (v === "Use this one") chosen = d;
    break;
  }
  if (!chosen) return;
  applySystem(slot, chosen);
  await c.say("Done. I built **" + chosen.name + "**. It has steps and a low-energy version for tired days.", "When should it start? Tie it to something you already do.");
  const t = await c.ask({ options: ["After dinner", "When I wake up", "When I get home", "After school drop-off", "At my weekly reset"], def: "After dinner", guess: first });
  set("sb." + slot + ".trigger", t || "After dinner");
  set("sb." + slot + ".freq", /weekly reset/i.test(t || "") ? "Weekly" : "Daily");
  await c.say("Good. " + (t ? "Whenever it’s " + t.charAt(0).toLowerCase() + t.slice(1) + ", you start." : "You’ll start it at the same time each day.") + " That’s how a system runs without you having to remember.");
}

const STEPS = [
  { id: "name", run: async c => {
    await c.say("Hi, I’m your Wendaful system assistant, built on Wenda’s method. I do most of the work. You tap, I set it up.",
      card({ title: "Here’s what I’ll help you do", h: "h3", kids: [h("ol", { class: "stack tight" }, [
        "Give everything one home, in your planner, your phone, your computer, or a mix.",
        "Build one small system and one habit that fit your real life.",
        "Make a floor for tired days, so it’s never all or nothing.",
        "Get you going again when you skip days. No guilt, no starting over."].map((t, i) => h("li", { class: "num solid" }, h("span", { class: "n" }, String(i + 1)), h("span", null, t))))] }),
      "It takes about 5 minutes. Tap **Use my best guess** any time and I’ll fill in the rest. You can change anything later.", "What should I call you?");
    const v = await c.ask({ type: "text", placeholder: "Your name", aria: "Your name", skip: "Skip", def: "" });
    if (v) { set("name", v); await c.say("Nice to meet you, " + v + "."); }
  } },
  { id: "struggle", run: async c => {
    await c.say("What’s getting in your way right now? Pick the closest one.");
    const v = await c.ask({ options: STRUGGLES.map(s => s[0]).concat(["All of it"]), def: "I don’t know where to start." });
    const s = STRUGGLES.find(x => x[0] === v);
    if (s) { set("struggle", v); await c.say(s[1]); if (s[3]) await c.say("*" + s[3] + "*"); }
    else await c.say("Then we’ll start with the basics: one home for everything.");
    await c.say("I’ll build your system around that.");
  } },
  { id: "tools", run: async c => {
    await c.say("What do you plan with? Pick everything you use. A mix is great, and each tool gets one job.");
    const v = await c.ask({ multi: true, options: TOOL_OPTS, def: TOOL_DEFAULT });
    const T = v && v.length ? v : TOOL_DEFAULT;
    const H = saveTools(T);
    await c.say("Here’s the setup I chose for you. Each part has one home, so you always know where things go.");
    await c.say(card({ title: "Your 4 parts", h: "h3", kids: [h("dl", { class: "dl" },
      ...[["Inbox", H.inbox], ["Calendar", H.cal], ["Tasks", H.tasks], ["Notes", H.notes]].map(r => [h("dt", null, r[0]), h("dd", null, r[1])]).flat())] }));
  } },
  { id: "who", run: async c => {
    await c.say("Who else needs to see your calendar?");
    const v = await c.ask({ options: ["Just me", "My partner", "My whole family", "My team at work"], def: "My whole family" });
    set("part.cal.who", v || "My whole family");
    await c.say(v === "Just me" ? "Got it. Your calendar is just yours." : "Got it. I’ll note that you share your calendar with " + (v || "My whole family").replace(/^My /, "your ").toLowerCase() + ".");
  } },
  { id: "sort", run: async c => {
    await c.say("Once a week you’ll spend 10 minutes sorting your inbox into your calendar, tasks, and notes. That one habit keeps everything from piling up. When works best?");
    const v = await c.ask({ options: [["Sunday, 7:30 pm", "Sunday|7:30 pm"], ["Saturday, 9:00 am", "Saturday|9:00 am"], ["Monday, 8:00 am", "Monday|8:00 am"], ["Friday, 3:00 pm", "Friday|3:00 pm"]], def: "Sunday|7:30 pm" });
    const [day, time] = String(v || "Sunday|7:30 pm").split("|");
    set("sort.day", day); set("sort.time", time);
    await c.say("Done. Put this on your calendar so it happens.");
    await c.say(genBlock("Repeating event in my calendar", "Make a new event, paste this in, and set it to repeat.", "Title: Weekly sort (10 minutes)\nRepeat: Weekly on " + day + " at " + time + "\nAlert: 10 minutes before\nNote: Empty my inbox into my calendar, tasks, and notes."));
    await c.ask({ options: ["Added it", "I’ll do it later"], def: "I’ll do it later", guess: false });
  } },
  { id: "area", run: async c => {
    await c.say("Which part of life would feel better if it ran on its own?");
    const v = await c.ask({ options: AREAS.map(a => a[0]), def: "Home" });
    set("focus.1.name", v || "Home"); set("focus.1.why", "It drains me right now");
    await c.say("Good pick. We’ll start small.");
  } },
  { id: "system", run: async c => { await systemFlow(c, 1); } },
  { id: "habit", run: async c => {
    await c.say("Now one habit you want to keep up, even on tired days. Pick one. I’ll make it tiny so it’s easy to start.");
    c.habit = await habitFlow(c, 0);
  } },
  { id: "night", run: async c => {
    const hb = c.habit || HABITS.find(x => x.name === get("fam.0.h")) || HABITS[0];
    await c.say("Here’s how I make mornings easy: the choices get made the night before, so there’s nothing to talk yourself out of. Want me to set up your night-before list?");
    const v = await c.ask({ options: ["Yes, set it up for me", "Skip this"], def: "Yes, set it up for me" });
    if (v === "Skip this") return;
    hb.night.forEach((t, i) => set("night." + i, t));
    await c.say("Done. Each night: **" + hb.night.join(", ") + ".**", "Then on a day you don’t feel like it, you’re just going to **" + (get("night.just") || hb.just) + "**. No debate. Starting is the win.");
  } },
  { id: "mvd", run: async c => {
    await c.say("Last one. On a day that goes sideways, five small things keep life moving. Want my starter list?");
    const v = await c.ask({ options: ["Use Wenda’s starter list", "I’ll write my own later"], def: "Use Wenda’s starter list" });
    if (v === "Use Wenda’s starter list") { MVD_STARTER.forEach((t, i) => set("mvd." + i, t)); await c.say("Done. If you hit these five, the day counts."); }
  } },
  { id: "finish", run: async c => {
    c.fast = false;
    set("asst.done.finish", 1); refreshChrome();
    await c.say("That’s it. **Your system is built.** Here’s what I set up for you:", systemGlance());
    await c.say("Next, let’s put it where you’ll see it. That’s what makes it stick.");
    const v = await c.ask({ options: ["Put it in my tools", "Open Today", "Save my printable plan"], def: "Open Today", guess: false });
    if (v === "Put it in my tools") await applyWalk(c);
    else if (v === "Save my printable plan") await c.say(printCard());
    else if (v === "Open Today") { nav("today"); }
  } }
];
const asstDone = () => STEPS.filter(s => asstAnswered(s.id)).length;
const ASST_TOTAL = () => STEPS.length;
const asstComplete = () => asstAnswered("finish");

function systemGlance() {
  const rows = [["My 4 parts", ["inbox", "cal", "tasks", "notes"].filter(k => get("part." + k + ".home")).length + " homes set"],
    ["Weekly sort time", [get("sort.day"), get("sort.time")].filter(Boolean).join(" at ")], ["Focus area", get("focus.1.name")],
    ["My system", [1, 2, 3].map(n => get("sb." + n + ".name")).filter(Boolean).join(", ")],
    ["My habit and floor", get("fam.0.h") ? get("fam.0.h") + ": " + get("fam.0.f") : ""], ["Night before", [0, 1, 2, 3].map(i => get("night." + i)).filter(Boolean).join(", ")],
    ["Minimum viable day", [0, 1, 2, 3, 4].filter(i => get("mvd." + i)).length ? "5 small things" : ""]].filter(r => r[1]);
  return card({ title: "Your system", h: "h3", kids: [h("dl", { class: "dl" }, ...rows.map(r => [h("dt", null, r[0]), h("dd", null, r[1])]).flat())] });
}
function printCard() {
  return card({ cls: "out", title: "Your printable plan", h: "h3", sub: "A 3-page PDF with everything I just set up. Print it, or keep it on your phone.",
    kids: [h("div", { class: "row" }, btn("Save my plan as a PDF", e => savePlan(e.currentTarget)), btn("Copy as text", () => copyText(summaryText()), "ghost"))] });
}
/* ============ what do you need? ============ */
const ACTIONS = [
  ["Plan my day", "plan"], ["I don’t feel like it", "nofeel"], ["I’m overwhelmed", "overwhelmed"], ["I skipped a few days", "restart"],
  ["Match my energy", "energy"], ["Keep me consistent", "consistent"], ["Give me a routine", "routine"], ["Do my weekly reset", "weekly"], ["More…", "more"]
];
const MORE = [["Put it in my tools", "setup"], ["Add another system", "addsystem"], ["Print my plan", "print"], ["Change something", "change"], ["Teach me the method", "learn"]];
function timerCard(min, label, doneMsg, onDone) {
  return card({ cls: "out", kids: [timer({ minutes: min, label, doneMsg, onDone })] });
}
function markFloorToday() { if (get("fam.0.h")) set("fl." + today() + ".0", "F"); }
const justText = () => get("night.just") || (get("fam.0.f") ? "do your floor: " + get("fam.0.f") : "start for 5 minutes");

async function runAction(c, key) {
  if (PACKS[key]) { await PACKS[key](c); return; }
  if (key === "more") {
    await c.say("What else can I do?");
    const v = await c.ask({ options: MORE.concat([["Never mind", "back"]]), guess: false });
    if (v && v !== "back") await runAction(c, v);
    return;
  }
  if (key === "plan") {
    const T = today(), rows = h("div", { class: "stack tight" });
    for (let i = 0; i < 3; i++) rows.append(chkEl("top." + T + "." + i + ".c", cellInput("top." + T + "." + i + ".t", { aria: "Top " + (i + 1), ph: i === 0 ? "The one thing I’ll do first" : "" }), { cls: "line" }));
    await c.say("Let’s keep it small. Pick your top 3 for today. Just three.", card({ cls: "out", title: "My top 3 today", h: "h3", kids: [rows] }),
      "Start with number 1 and don’t add anything. Everything after your top 3 is a bonus.");
  } else if (key === "nofeel") {
    await c.say("I hear you. Here’s the deal: no talking yourself out of it. You’re just going to **" + justText() + "**.", "That’s all. Starting is the win, and you’ll probably do more once you’re moving.",
      timerCard(5, "Start: just do it", "That counts. You showed up.", markFloorToday));
  } else if (key === "overwhelmed") {
    if (!LIBREG.frozen) BYID["lib-hard"].build();
    await c.say("Okay. Breathe. Too much at once is a lot. We’re going to do **one** thing, and nothing else.");
    let again = true;
    while (again && c.alive()) {
      const items = cardItems(LIBREG.frozen), it = items[Math.floor(Math.random() * items.length)];
      addToDay(it.t);
      await c.say("Just this: **" + it.t + ".**");
      const v = await c.ask({ options: ["I did it", "Pick a different one", "I’ll rest instead"], def: "I did it", guess: false });
      if (v === "Pick a different one") continue;
      again = false;
      await c.say(v === "I did it" ? "Nice. That’s enough for now. You can stop here." : "Rest counts. Nothing else is required today.");
    }
  } else if (key === "restart") {
    await c.say("That’s okay. **Today is day one again.** There’s nothing to catch up on.",
      "Do your floor, and nothing more: **" + (get("fam.0.f") || "start for 5 minutes") + ".**", timerCard(5, "Do my floor now (5 min)", "You’re back. That counts.", markFloorToday));
  } else if (key === "weekly") {
    const med = firstMed();
    await c.say("Let’s do your weekly reset. It takes about 10 minutes. I’ll go one step at a time.",
      checklistCard({ id: "wr-run", title: "My weekly reset", tone: "out", items: WEEKLY_STEPS[med], startMode: "one" }));
  } else if (key === "setup") { await applyWalk(c); }
  else if (key === "addsystem") {
    const slot = [2, 3].find(n => !get("sb." + n + ".name"));
    if (!slot) { await c.say("You have three systems built already. That’s plenty. Run them for two weeks, then we’ll add more."); return; }
    await systemFlow(c, slot);
  } else if (key === "print") { await c.say("Here you go. Print it or keep it on your phone.", printCard()); }
  else if (key === "change") { await c.say("You can change anything on **My system**.", h("div", null, btn("Open My system", () => nav("workbook"), "sm"))); }
  else if (key === "learn") { await c.say("If you want to understand why this works, the method pages explain each part.", h("div", null, btn("Learn the method", () => nav("learn"), "sm"))); }
}

async function runAssistant(c) {
  if (!asstComplete()) {
    const resumed = asstDone() > 0;
    if (resumed) await c.say("Welcome back. Let’s pick up where we left off.");
    for (const s of STEPS) {
      if (asstAnswered(s.id)) continue;
      await s.run(c);
      if (!c.alive()) return;
      set("asst.done." + s.id, 1); refreshChrome();
    }
  } else {
    const nm = get("name");
    await c.say((nm ? "Welcome back, " + nm + "." : "Welcome back.") + " What do you need?");
  }
  while (c.alive()) {
    const v = await c.ask({ prompt: "What do you need?", options: ACTIONS.map(a => [a[0], a[1]]), guess: false });
    if (!c.alive()) return;
    await runAction(c, v);
  }
}

function renderAssistant() {
  const done = asstComplete(), name = get("name"), hour = new Date().getHours();
  const hi = (hour < 12 ? "Good morning" : hour < 18 ? "Good afternoon" : "Good evening") + (name ? ", " + name : "") + ".";
  const root = h("div", { class: "chat" });
  const art = h("article", { class: "lesson" },
    h("div", { class: "wrap" }, strip(APP_NAME, "Your helper"),
      h("div", { class: "head" }, h("h1", { class: "h1" }, done ? hi : "Let’s set up your system."),
        p(done ? "Tell me what you need. I’ll do the work." : "I help you get organized, build routines that stick, and keep going when it gets hard. You tap, I set it up. About 5 minutes.", "lede"),
        done && isSortDay() ? p("**Today is your sort day.** Ten minutes: empty your inbox into your calendar, tasks, and notes.", "bar") : null)),
    h("div", { class: "wrap" }, root));
  const c = createChat(root);
  setTimeout(() => { runAssistant(c).catch(e => console.error(e)); }, 0);
  return art;
}
</script>
<script>
"use strict";
/* ============ Systems Library and Consistency Pack, in the chat ============
   The assistant picks from the same lists the Toolbox pages use, so a tick in one place shows up in the other.
   Library: energy menus and routines. Consistency Pack: one small flow for each "I always…" problem. */
const shuffle = a => { const x = a.slice(); for (let i = x.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [x[i], x[j]] = [x[j], x[i]]; } return x; };
function needList(id, page) { if (!LIBREG[id]) BYID[page].build(); return LIBREG[id]; }
const ask1 = (c, ph, aria, skip) => c.ask({ type: "text", placeholder: ph, aria, skip: skip || "Skip", guess: false });
const PACKS = {}, CP = {};

/* ---- Systems Library: what kind of day is this? ---- */
PACKS.energy = async c => {
  await c.say("What kind of day is this?");
  const hv = await c.ask({ options: HUB.map(x => [x[0], x[1]]), guess: false });
  const e = HUB.find(x => x[1] === hv); if (!e) return;
  const o = needList(e[1], e[2]);
  await c.say("**" + o.title + ".** " + (o.sub || "") + " Tap what you want to do today. One to three is plenty.");
  let pool = shuffle(cardItems(o).map(it => it.t)), at = 0;
  for (;;) {
    if (at >= pool.length) { at = 0; pool = shuffle(pool); }
    const v = await c.ask({ multi: true, options: pool.slice(at, at + 6).map(t => [t, t]), more: "Show different ones", cont: "Add to Today", none: "Nothing today", guess: false });
    if (v === "__more__") { at += 6; continue; }
    if (v && v.length) { v.forEach(addToDay); await c.say("Added " + v.length + " to Today. That’s your day. Anything else is a bonus."); }
    else await c.say("That’s okay. Rest counts too.");
    break;
  }
};

/* ---- Systems Library: give me a routine ---- */
const ROUTINES = [["Morning routine", "morning", "lib-daily"], ["Evening reset", "eve", "lib-daily"], ["School morning", "sm", "lib-family"], ["After-school flow", "as", "lib-family"],
  ["Kids’ bedtime", "kb", "lib-family"], ["Weekly cleaning", "wc", "lib-homemoney"], ["Weekly bills and money", "wb", "lib-homemoney"], ["Monthly admin hour", "ma", "lib-admin"],
  ["Weekly family check-in", "fc", "lib-partner"], ["Trip prep", "t1", "lib-travel"], ["Packing list", "pk", "lib-pack"], ["Content batch day", "bb", "lib-batch"], ["Digital cleanup", "dm", "lib-digital"]];
async function routineEvent(c, name) {
  await c.say("How often?");
  const f = await c.ask({ options: ["Every day", "Weekdays", "Every week", "Every month"], def: "Every week", guess: false });
  await c.say("What time?");
  const t = await ask1(c, "7:00 am", "Time");
  await c.say("Add this to your calendar.", genBlock("Repeating event in my calendar", "Make a new event, paste this in, and set it to repeat.",
    "Title: " + name + "\nRepeat: " + f + (t ? " at " + t : "") + "\nAlert: 10 minutes before\nNote: Open my checklist and do it one step at a time."));
}
PACKS.routine = async c => {
  for (;;) {
    await c.say("Which routine do you want?");
    const rv = await c.ask({ options: ROUTINES.map(r => [r[0], r[1]]), guess: false });
    const r = ROUTINES.find(x => x[1] === rv); if (!r) return;
    const o = needList(r[1], r[2]);
    await c.say("Here’s my **" + r[0] + "**. Tick things off, go one at a time, or tap **Make it mine** to cross out what doesn’t fit.", checklistCard(Object.assign({}, o, { startMode: "view" })));
    const v = await c.ask({ options: ["Put it on my calendar", "Show me another", "I’m good"], def: "I’m good", guess: false });
    if (v === "Show me another") continue;
    if (v === "Put it on my calendar") await routineEvent(c, r[0]);
    return;
  }
};

/* ---- Consistency Pack: what's getting in the way? ---- */
const CP_PROBLEMS = [["I go all in, then I stop.", "floor"], ["I research and plan, and never start.", "start"], ["I have hundreds of content ideas.", "week3"],
  ["I keep skipping my workouts.", "move"], ["I tell myself I’ll do it tomorrow.", "excuse"], ["My house is tidy but never really clean.", "zone"],
  ["I have piles that have sat for months.", "pile"], ["I want to see that I’m showing up.", "track"], ["I stopped, and now I feel behind.", "restart"]];
PACKS.consistent = async c => {
  await c.say("What’s getting in the way? Pick the one that sounds like you.");
  const v = await c.ask({ options: CP_PROBLEMS.map(x => [x[0], x[1]]).concat([["Never mind", "back"]]), guess: false });
  if (v && CP[v]) await CP[v](c);
};

/* the 4-week tracker and movement plan need a start date, so the first use anchors the week */
function cpSlot() {
  if (!get("cp.start")) { const d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); set("cp.start", ymd(d)); }
  const st = new Date(get("cp.start") + "T12:00:00"), now = new Date(); now.setHours(12, 0, 0, 0);
  const days = Math.round((now - st) / 86400000);
  return days >= 0 && days < 56 ? { w: Math.floor(days / 7), d: days % 7 } : null;
}

CP.floor = async c => {
  const hb = get("fam.0.h");
  await c.say("That’s the all-or-nothing trap. The fix is a **floor**: a tiny version you can do on your most tired day. The floor always counts.");
  if (hb) await c.say("You already have one for **" + hb + "**: " + get("fam.0.f") + ".");
  const v = await c.ask({ options: ["Add another habit"].concat(hb ? ["Make my floor smaller"] : [], ["I’m good"]), def: "I’m good", guess: false });
  if (v === "Add another habit") {
    const slot = [0, 1, 2].find(i => !get("fam." + i + ".h"));
    if (slot == null) { await c.say("You have three habits. That’s plenty. Run them for two weeks first."); return; }
    await c.say("Which habit should I add?"); await habitFlow(c, slot);
    await c.say("Added. Its floor shows up on your Today page.");
  } else if (v === "Make my floor smaller") {
    await c.say("What’s a version so small you can’t say no?");
    const t = await ask1(c, "Shoes on, 2 minutes", "My smaller floor", "Never mind");
    if (t) { set("fam.0.f", t); await c.say("Done. Your floor is now **" + t + "**."); }
  }
};

CP.start = async c => {
  await c.say("Researching feels like progress, but it isn’t starting. Let’s start with what you already know.", "What’s the thing you want to start?");
  const th = await ask1(c, "A podcast, a meal plan, a business idea", "The thing I want to start");
  if (th) set("es.thing", th);
  await c.say("Set a research limit before you look anything up. Twenty minutes, one question, three sources at most. Then you pick one and go.", timerCard(20, "Start my research timer", "Time’s up. Pick one and go."));
  await c.ask({ options: ["The timer’s done", "I know enough already"], def: "I know enough already", guess: false });
  await c.say("What’s your next step, using only what you know right now?");
  const nx = await ask1(c, "Order the supplies", "My next step");
  if (nx) { set("es.next", nx); addToDay(nx); await c.say("Good enough for now. I put it on Today. Now give it your first 3 minutes.", timerCard(3, "Start my first 3 minutes", "That was your start.")); }
};

CP.week3 = async c => {
  await c.say("Leave the big list alone. Pull five ideas that catch your eye, then keep three.", "Type up to five. Separate them with commas.");
  const raw = await ask1(c, "Idea one, idea two, idea three", "Five ideas");
  const ideas = String(raw || "").split(/[,;\n]+/).map(x => x.trim()).filter(Boolean).slice(0, 5);
  if (!ideas.length) return;
  let keep = ideas, prev = [];
  while (ideas.length > 3) {
    await c.say("Now keep three. The rest go back on the list.");
    const v = await c.ask({ multi: true, options: ideas.map(x => [x, x]), def: prev, cont: "Keep these", none: "None", guess: false });
    if (v && v.length >= 1 && v.length <= 3) { keep = v; break; }
    prev = v || [];
    await c.say(v && v.length > 3 ? "Three is enough. Let go of " + (v.length - 3) + "." : "Pick at least one.");
  }
  clearPrefix("w3."); ideas.forEach((t, i) => { set("w3." + i + ".t", t); if (keep.includes(t)) set("w3." + i + ".pick", 1); });
  await c.say("Here’s your week.", card({ cls: "out", title: "This week’s 3", h: "h3", kids: [h("ol", { class: "stack tight" }, keep.map((t, i) => h("li", { class: "num solid" }, h("span", { class: "n" }, String(i + 1)), h("span", null, t)))),
    h("div", null, btn("Copy my 3", () => copyText("This week’s 3\n" + keep.map((t, i) => (i + 1) + ". " + t).join("\n")), "ghost sm"))] }),
    "Close the list. The other ones will still be there next week.");
};

function markMove(sz) {
  const s = cpSlot(); if (s && s.w < 4) set("mv." + s.w + "." + s.d, sz);
  if (get("fam.0.h") === "Move my body") set("fl." + today() + ".0", sz);
}
CP.move = async c => {
  const mv = get("fam.0.h") === "Move my body" ? { f: get("fam.0.f"), r: get("fam.0.r"), b: get("fam.0.b") } : { f: HABITS[0].f, r: HABITS[0].r, b: HABITS[0].b };
  if (!get("mm.floor")) set("mm.floor", mv.f); if (!get("mm.reg")) set("mm.reg", mv.r); if (!get("mm.bonus")) set("mm.bonus", mv.b);
  if (!get("mm.set") && nightList().length) set("mm.set", nightList().join(", "));
  await c.say("A workout plan that works in a messy week has three sizes. Any one counts.",
    card({ title: "My movement plan", h: "h3", kids: [h("dl", { class: "dl" }, ...[["Floor", get("mm.floor")], ["Regular", get("mm.reg")], ["Bonus", get("mm.bonus")]].map(r => [h("dt", null, r[0]), h("dd", null, r[1])]).flat())] }), "What do you want to do right now?");
  const v = await c.ask({ options: ["Start my floor now", "I already moved today", "Not today"], def: "Not today", guess: false });
  if (v === "Start my floor now") await c.say("Shoes on. Five minutes. When it rings, you’re done, and it counts.", timerCard(5, "Start my floor (5 min)", "That counts. You moved.", () => markMove("F")));
  else if (v === "I already moved today") {
    await c.say("Nice. Which size?");
    const z = await c.ask({ options: [["Floor", "F"], ["Regular", "R"], ["Bonus", "B"]], def: "F", guess: false });
    markMove(z || "F"); await c.say("Marked. Any size counts.");
  } else await c.say("That’s okay. Rest days are part of the plan.");
  await c.say("Your 4-week plan keeps track of every day you move.", h("div", null, btn("Open my 4-week plan", () => nav("cp-move"), "ghost sm")));
};

CP.excuse = async c => {
  await c.say("Pick your answer ahead of time, so there’s nothing to debate. Which excuse do you tell yourself?");
  const v = await c.ask({ options: PLAN_EXCUSES.map((e, i) => [e[0], String(i)]).concat([["Something else", "x"]]), guess: false });
  if (v == null) return;
  let key, excuse, def;
  if (v === "x") {
    await c.say("What do you tell yourself?");
    const t = await ask1(c, "I’ll start Monday", "My excuse", "Never mind"); if (!t) return;
    const n = [0, 1, 2, 3, 4, 5].find(i => !get("exc.x" + i + ".a")); if (n == null) { await c.say("Your list is full. You can edit it on My system."); return; }
    key = "exc.x" + n; set(key + ".a", t); excuse = t; def = "I do the floor version right now. It takes 5 minutes.";
  } else { const i = Number(v); key = "exc." + i; excuse = PLAN_EXCUSES[i][0]; def = PLAN_EXCUSES[i][1]; }
  const cur = get(key + ".b") || def;
  await c.say("When you hear **" + excuse + "**, your answer is:", "*" + cur + "*");
  const w = await c.ask({ options: ["Use that", "Write my own"], def: "Use that", guess: false });
  if (w === "Write my own") {
    await c.say("What will you do instead?");
    const t = await ask1(c, def, "My answer", "Keep it");
    if (t) { set(key + ".b", t); await c.say("Saved. Next time, say it out loud."); return; }
  }
  set(key + ".b", cur);
  await c.say("Good. Next time you hear it, do that. No debate.");
};

const ZONE_PLAN = [["Kitchen", "Wipe the stove and counters"], ["Bathroom", "Scrub one sink"], ["Bathroom", "Clean one toilet"], ["Living room", "Vacuum one room"], ["Floors", "Mop one floor"], ["Bedrooms", "Change one set of sheets"], ["Kitchen", "Clean the microwave"]];
CP.zone = async c => {
  await c.say("You already keep things tidy. This adds **one 10-minute clean a day**, so the deep stuff gets done a little at a time. Want me to set your week?");
  const v = await c.ask({ options: ["Set my week for me", "Not now"], def: "Set my week for me", guess: false });
  if (v !== "Set my week for me") return;
  ZONE_PLAN.forEach((z, i) => { set("zone." + i + ".z", z[0]); set("zone." + i + ".c", z[1]); });
  const DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"], di = (new Date().getDay() + 6) % 7;
  await c.say("Here’s your week.", card({ title: "My zone week", h: "h3", kids: [h("dl", { class: "dl" }, ...DAYS.map((d, i) => [h("dt", null, d), h("dd", null, ZONE_PLAN[i][0] + ": " + ZONE_PLAN[i][1])]).flat())] }),
    "Today is " + DAYS[di] + ". **" + ZONE_PLAN[di][1] + ".** Set the timer. When it rings, you’re done, even if the zone could use more.",
    timerCard(10, "Start a 10-minute clean", "Time’s up. You’re done.", () => set("zone." + di + ".w1", 1)));
};

CP.pile = async c => {
  await c.say("Piles get smaller one round at a time. One pile, 10 minutes, four spots.", "Where’s the pile?");
  const t = await ask1(c, "Mail on the counter", "My pile"); if (!t) return;
  let i = [0, 1, 2, 3, 4, 5, 6].find(j => get("pile." + j + ".n") === t);
  if (i == null) i = [0, 1, 2, 3, 4, 5, 6].find(j => !get("pile." + j + ".n"));
  if (i == null) { await c.say("Your pile list is full. Finish one first."); return; }
  set("pile." + i + ".n", t);
  await c.say("Every item goes to one of four spots.", card({ kids: [h("dl", { class: "dl" }, ...[["Trash", "Or recycle. Bag it now."], ["Elsewhere", "Into a basket. Deliver it when the timer rings."],
    ["Needs action", "Into your inbox. Deal with it at your weekly reset."], ["Stays", "It lives here. Put it back neatly."]].map(r => [h("dt", null, r[0]), h("dd", null, r[1])]).flat())] }),
    "Set the timer and sort. When it rings, stop.");
  for (;;) {
    const j = [0, 1, 2, 3, 4, 5].find(r => !get("pile." + i + ".r." + r));
    await c.say(timerCard(10, "Start a round", "Time’s up. Stop and color one circle.", () => { if (j != null) set("pile." + i + ".r." + j, 1); }));
    const v = await c.ask({ options: ["The pile is gone", "Another round", "Good for today"], def: "Good for today", guess: false });
    if (v === "The pile is gone") { set("pile." + i + ".g", 1); await c.say("Gone. That’s a win."); break; }
    if (v === "Another round") continue;
    await c.say("A smaller pile is a win. See you next round."); break;
  }
};

CP.track = async c => {
  const s = cpSlot(), habits = [0, 1, 2].filter(i => get("fam." + i + ".h"));
  if (!s) { await c.say("Your 4-week tracker has run its course. Open it to start fresh.", h("div", null, btn("Open my tracker", () => nav("cp-tracker"), "sm"))); return; }
  if (!habits.length) { await c.say("Add a habit first, so I know what to track. Tap **Keep me consistent**, then **I go all in, then I stop.**"); return; }
  await c.say("Color a box on any day you did the floor or more. A blank box is fine.", "Which did you do today?");
  const v = await c.ask({ multi: true, options: habits.map(i => [get("fam." + i + ".h"), String(i)]), cont: "Color today’s boxes", none: "None today", guess: false });
  const r = s.w < 4 ? 1 : 2, wk = s.w % 4 + 1;
  (v || []).forEach(i => set("tr." + r + "." + (Number(i) + 1) + "." + wk + "." + s.d, 1));
  let n = 0; for (let hb = 1; hb <= 3; hb++) for (let w = 1; w <= 4; w++) for (let d = 0; d < 7; d++) if (get("tr." + r + "." + hb + "." + w + "." + d)) n++;
  await c.say(v && v.length ? "Colored. That’s **" + n + " boxes** so far in round " + r + ". More colored boxes than last month means it’s working." : "A blank box is fine. Tomorrow is a fresh box.",
    h("div", null, btn("Open my 4-week tracker", () => nav("cp-tracker"), "ghost sm")));
};
CP.restart = c => runAction(c, "restart");
</script>
<script>
"use strict";
/* ============ put it in my tools ============
   Each tool gets one job, and nothing gets planned in two places. The kits below turn what the person
   told the assistant into copy-ready text for a paper planner, a digital calendar, a wall calendar,
   a task or project app, and a notes app. */
const TOOL_JOB = { planner: "My top 3, my brain dump, and my week at a glance", dcal: "Appointments and anything with a time",
  wall: "What the whole family needs to see", tasks: "Everything to do that has no set time", notes: "Info and ideas to keep" };
const TOOL_NAME = { planner: "Paper planner", dcal: "Digital calendar", wall: "Wall calendar", tasks: "Task or project app", notes: "Notes app" };

function saveTools(T) {
  clearPrefix("tools.use."); T.forEach(m => set("tools.use." + m, 1));
  const dig = T.includes("dcal") || T.includes("tasks") || T.includes("notes"), P = T.includes("planner");
  clearPrefix("setup.med."); if (P) set("setup.med.planner", 1); if (dig) { set("setup.med.phone", 1); set("setup.med.computer", 1); }
  if (!P && !dig) set("setup.med.planner", 1);
  set("tool.mode", P && dig ? "Hybrid" : dig ? "Digital" : "Paper");
  Object.keys(TABMEM).forEach(k => { if (k.startsWith("tg-")) delete TABMEM[k]; });
  const H = homesFor(T);
  set("part.inbox.home", H.inbox); set("part.cal.home", H.cal); set("part.tasks.home", H.tasks); set("part.notes.home", H.notes);
  set("part.inbox.backup", dig ? "A note on my phone" : "A sticky note"); set("part.tasks.mark", P ? "I star it" : "I flag it"); set("part.notes.find", T.includes("notes") ? "I search for it" : "Tabs and dividers");
  return H;
}

const sortWhen = () => [get("sort.day"), get("sort.time")].filter(Boolean).join(" at ");
const habitAt = () => ({ "in the morning": "7:00 am", "in the afternoon": "1:00 pm", "in the evening": "7:00 pm", "after work": "5:30 pm" })[get("fam.0.when")] || "7:00 am";
const nightList = () => [0, 1, 2, 3].map(i => get("night." + i)).filter(Boolean);
const sysSteps = n => [0, 1, 2, 3, 4].map(i => get("sb." + n + ".step." + i)).filter(Boolean);
const sysNums = () => [1, 2, 3].filter(n => get("sb." + n + ".name"));
const usesT = id => !!get("tools.use." + id);

const KITS = {
  planner: () => {
    const hb = get("fam.0.h"), nl = nightList();
    return { steps: [
      "Pick a blank page near the front and write **Inbox** at the top. Everything new lands here first.",
      "On this week’s page, write your sort time: **" + (sortWhen() || "my weekly sort") + "**.",
      "Add a small **Top 3** box to each daily page. Fill it in the night before.",
      "Write your floor right in the plan" + (hb ? ", like **" + hb + ": " + get("fam.0.f") + "**" : "") + ". The small version is the plan, and anything more is a bonus.",
      "Use the back pages for notes, so the front stays clear."],
      blocks: [["What to write in my planner", "Copy it by hand. Writing it down helps you remember it.",
        ["INBOX PAGE", "Everything new goes here first.", "", "THIS WEEK", "Weekly sort: " + (sortWhen() || "my sort day") + " (10 min)", "", "EVERY DAY", "Top 3:  1.    2.    3.",
          hb ? (get("fam.0.when") ? get("fam.0.when").replace(/^./, x => x.toUpperCase()) + ": " : "") + hb + ": " + get("fam.0.f") : "", nl.length ? "Night before: " + nl.join(", ") : "",
          "", get("night.just") ? "ON A HARD DAY\nJust: " + get("night.just") : ""].filter((x, i, a) => x !== "" || (a[i - 1] !== "" && i > 0)).join("\n").trim()]] };
  },
  dcal: () => {
    const hb = get("fam.0.h"), nl = nightList(), who = get("part.cal.who"), blocks = [];
    blocks.push(["Repeating event: weekly sort", "Make a new event, paste this in, and set it to repeat.",
      "Title: Weekly sort (10 minutes)\nRepeat: Weekly on " + (sortWhen() || "my sort day") + "\nAlert: 10 minutes before\nNote: Empty my inbox into my calendar, tasks, and notes."]);
    if (hb) blocks.push(["Repeating event: " + hb, "Same thing. Put the floor right in the title.", "Title: " + hb + ": " + get("fam.0.f") + "\nRepeat: Every day at " + habitAt() + "\nAlert: 5 minutes before\nNote: The floor counts. Anything more is a bonus."]);
    if (nl.length) blocks.push(["Repeating event: night before", "This one makes tomorrow’s choices tonight.", "Title: Night before: " + nl.join(", ") + "\nRepeat: Every day at 8:30 pm\nAlert: At the time of the event\nNote: Decide tomorrow tonight."]);
    return { steps: [
      "Use the calendar you already have, or make one just for your system.",
      "Add each event below. Paste it in, set the repeat, and save.",
      who && who !== "Just me" ? "Share it with **" + who.replace(/^My /, "your ").toLowerCase() + "**. Most apps have a Share option in the calendar’s settings." : "Keep it private, since this one is just for you.",
      "One rule: only things with a **date or a time** go here. To-dos go in your task list."], blocks };
  },
  wall: () => ({ steps: [
    "Hang it where everyone walks past, like the kitchen or the entryway. Keep a pen on a string beside it.",
    "Give each person a color. One color for the whole family works too.",
    "Only write things other people need to know: appointments, practices, days off school, trips, birthdays.",
    usesT("dcal") ? "Your digital calendar is the source of truth. At your weekly sort" + (get("sort.day") ? " on " + get("sort.day") : "") + ", copy the next week’s shared plans onto the wall." : "This is your main calendar. Write new dates on it the moment you hear them.",
    "Keep to-dos and your top 3 off the wall. They live in your planner or task list."],
    blocks: [["My wall calendar rules", "Write these on a sticky note and stick it to the calendar.",
      "• Only shared stuff goes on the wall\n• One color per person\n• " + (usesT("dcal") ? "New dates go in my digital calendar first, then the wall" : "New dates go on the wall right away") + "\n• I update it at my weekly sort" + (sortWhen() ? " (" + sortWhen() + ")" : "")]] }),
  tasks: () => {
    const first = sysNums()[0], nm = first ? get("sb." + first + ".name") : "My first system", st = first ? sysSteps(first) : [], hb = get("fam.0.h"), nl = nightList();
    const rep = ["Weekly sort: repeats weekly on " + (get("sort.day") || "my sort day")];
    if (hb) rep.push(hb + ": " + get("fam.0.f") + ": repeats every day"); if (nl.length) rep.push("Night before: " + nl.join(", ") + ": repeats every day");
    return { steps: [
      "Make three lists or projects: **Inbox**, **This week**, and one for **" + nm + "**.",
      st.length ? "Paste in the tasks for " + nm + ". Many apps make one task for each line you paste." : "Add the steps of your first system as tasks.",
      "Set up the repeating tasks, so you never have to remember them.",
      "Mark what’s next the way you chose: **" + (get("part.tasks.mark") || "I star it") + "**. Three at most each day.",
      "One rule: if it has a time, it goes on the calendar. Everything else goes here."],
      blocks: [["Lists or projects to make", "Names you can paste in.", "Inbox\nThis week\n" + nm],
        st.length ? ["Tasks for " + nm, "One task per line.", st.join("\n")] : null,
        ["Repeating tasks", "Set each one to repeat.", rep.join("\n")]] };
  },
  notes: () => ({ steps: [
    "Make a folder for each area of life. Start with the five below. You can rename them later.",
    /notes app/i.test(get("part.inbox.home")) ? "Make a note called **Inbox** and pin it to the top." : "Pin the notes you open every week.",
    "Search finds almost anything, so folders don’t have to be perfect."],
    blocks: [["Folders to make", "Rename any of them.", ["Home", "Family", "Work or content", "Ideas", "Reference"].join("\n")]] })
};

async function applyWalk(c) {
  let T = toolsUsed();
  if (T.length) {
    await c.say("You use " + T.map(id => TOOL_NAME[id].toLowerCase()).join(", ") + ". Each one gets a single job, so nothing gets planned in two places.");
    const v = await c.ask({ options: ["Set them up", "Change my tools"], def: "Set them up", guess: false });
    if (v === "Change my tools") T = [];
  }
  if (!T.length) {
    await c.say("What do you plan with? Pick everything you use.");
    const v = await c.ask({ multi: true, options: TOOL_OPTS, def: TOOL_DEFAULT, guess: false });
    T = v && v.length ? v : TOOL_DEFAULT; saveTools(T);
    await c.say("Got it. I updated your four homes to match.");
  }
  for (let i = 0; i < T.length; i++) {
    const id = T[i], k = KITS[id]();
    await c.say("**" + TOOL_NAME[id] + ".** Its one job: " + TOOL_JOB[id].replace(/^My /, "your ").replace(/^./, x => x.toLowerCase()) + ".");
    await c.say(card({ cls: "out", title: "Set it up", h: "h3", kids: [h("ol", { class: "stack tight" }, k.steps.map((t, j) => h("li", { class: "num solid" }, h("span", { class: "n" }, String(j + 1)), h("span", null, rt(t)))))] }));
    for (const b of k.blocks.filter(Boolean)) await c.say(genBlock(b[0], b[1], b[2]));
    const v = await c.ask({ options: [i < T.length - 1 ? "Done, next tool" : "Done", "I’ll do this later"], def: "I’ll do this later", guess: false });
    if (v && !/later/.test(v)) set("tools.done." + id, 1);
  }
  await c.say("That’s your tools. Here’s who does what:", card({ title: "One job each", h: "h3", kids: [h("dl", { class: "dl" }, ...T.map(id => [h("dt", null, TOOL_NAME[id]), h("dd", null, TOOL_JOB[id].replace(/^My /, "")) ]).flat())] }),
    "**The hard part is done.** Come back to Today each morning, and I’ll keep you on track.");
}
</script>
