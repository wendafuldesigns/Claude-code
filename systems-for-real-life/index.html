<title>Systems for Real Life</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Instrument+Serif:ital@0;1&family=Playfair+Display:wght@500&display=swap">
<style>
/* Layout concept: a paper workbook turned into an app. Ruled lines you type on,
   hairline strips for page headers, evergreen cover bands for each level,
   a course outline on the left and one workbook page at a time on the right. */
:root{
  --bg:#faf5f0; --surface:#ffffff; --panel:#f4f1ed; --callout:#dadfdc; --warm:#ece4d8;
  --rule:#d6d1c9; --edge:#373a40; --ink:#373a40; --muted:#545454;
  --accent:#54645b; --sage:#94a69c; --btn:#54645b; --btn-ink:#ffffff;
  --hero:#54645b; --hero-ink:#ffffff; --hero-sub:#e4eae6; --hero-rule:rgba(255,255,255,.35);
  --example:#4a5b52;
  --serif:'Instrument Serif','Iowan Old Style','Palatino Linotype',Georgia,serif;
  --sans:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --brand:'Playfair Display',Georgia,serif;
  --lh:36px; --hdr:56px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161c19; --surface:#1e2622; --panel:#252e29; --callout:#2e3933; --warm:#38342b;
    --rule:#3a4640; --edge:#6d7a73; --ink:#ebe8e2; --muted:#aab2ad;
    --accent:#a9bbb1; --sage:#94a69c; --btn:#94a69c; --btn-ink:#14201a;
    --hero:#33403a; --hero-ink:#f4f1ed; --hero-sub:#cdd6d0; --hero-rule:rgba(255,255,255,.25);
    --example:#b9c9bf;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161c19; --surface:#1e2622; --panel:#252e29; --callout:#2e3933; --warm:#38342b;
  --rule:#3a4640; --edge:#6d7a73; --ink:#ebe8e2; --muted:#aab2ad;
  --accent:#a9bbb1; --sage:#94a69c; --btn:#94a69c; --btn-ink:#14201a;
  --hero:#33403a; --hero-ink:#f4f1ed; --hero-sub:#cdd6d0; --hero-rule:rgba(255,255,255,.25);
  --example:#b9c9bf;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--sans);-webkit-font-smoothing:antialiased;text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent);text-underline-offset:3px}
p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- type ---------- */
h1,h2,h3,h4{font-family:var(--serif);font-weight:400;color:var(--accent);margin:0;text-wrap:balance;letter-spacing:-.005em}
.h1{font-size:clamp(2.6rem,6.2vw,3.9rem);line-height:.98}
h2{font-size:clamp(1.65rem,3.4vw,2.05rem);line-height:1.1}
h3{font-size:1.5rem;line-height:1.12}
h4{font-size:1.25rem;line-height:1.15}
.eyebrow{font:600 11px/1.3 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.lede{font-size:1.1rem;line-height:1.5;max-width:56ch}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.ex{font-family:var(--serif);font-style:italic;color:var(--example);font-size:1.15em}

/* ---------- app shell ---------- */
.app{height:100%;display:flex;flex-direction:column}
.top{flex:none;background:var(--bg);border-bottom:1px solid var(--rule);z-index:5}
.top-in{height:var(--hdr);display:flex;align-items:center;gap:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.menu{display:none;flex:none;width:40px;height:40px;border:1px solid var(--rule);background:var(--surface);border-radius:2px;align-items:center;justify-content:center}
.menu svg{width:18px;height:18px;stroke:var(--ink)}
.brand{display:flex;align-items:baseline;gap:12px;background:none;border:0;padding:0;text-align:left;min-width:0}
.brand .wm{font:500 1.35rem/1 var(--brand);color:var(--accent);letter-spacing:.01em}
.brand .ttl{font:600 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topstat{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:.8125rem;color:var(--muted);white-space:nowrap}
.mini{width:110px;height:6px;background:var(--callout);border-radius:3px;overflow:hidden}
.mini i{display:block;height:100%;width:0;background:var(--btn);transition:width .4s ease}
.shell{flex:1;min-height:0;display:grid;grid-template-columns:304px minmax(0,1fr)}
.side{overflow:auto;border-right:1px solid var(--rule);background:var(--bg);overscroll-behavior:contain}
.side-in{padding:18px max(16px,env(safe-area-inset-left,0px)) 40px 16px;display:flex;flex-direction:column;gap:6px}
.main{overflow:auto;min-width:0;scroll-behavior:auto;outline:0}
.scrim{position:fixed;inset:0;background:rgba(20,28,24,.5);z-index:19}

/* sidebar */
.nv-top{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
.nv{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-left:2px solid transparent;padding:8px 8px 8px 10px;color:var(--ink);font-size:.9375rem;line-height:1.3;min-height:38px}
.nv:hover{background:var(--panel)}
.nv.on{background:var(--panel);border-left-color:var(--accent);font-weight:600}
.nv .mk{flex:none}
.nh{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:14px 4px 8px;color:var(--ink)}
.nh .t{flex:1;min-width:0}
.nh .t b{display:block;font:400 1.2rem/1.1 var(--serif);color:var(--accent)}
.nh .cnt{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.nh .chev{width:10px;height:10px;border:solid var(--muted);border-width:0 1.5px 1.5px 0;transform:rotate(45deg);transition:transform .15s;margin:0 4px 3px 0;flex:none}
.nh[aria-expanded="true"] .chev{transform:rotate(-135deg);margin:4px 4px 0 0}
.nl{display:none;flex-direction:column;padding-bottom:6px}
.nl.open{display:flex}
.mk{width:16px;height:16px;border:1.5px solid var(--sage);border-radius:50%;position:relative;flex:none;background:transparent}
.mk.on{background:var(--btn);border-color:var(--btn)}
.mk.on::after{content:"";position:absolute;left:4.5px;top:1.5px;width:4px;height:7px;border:solid var(--btn-ink);border-width:0 1.8px 1.8px 0;transform:rotate(45deg)}
.savenote{margin-top:14px;padding:12px;background:var(--panel);font-size:.8125rem;color:var(--muted);line-height:1.45}

/* ---------- page frame ---------- */
.wrap{width:100%;max-width:840px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap.wide{max-width:1040px}
.lesson{padding-bottom:64px;animation:rise .28s ease both}
@keyframes rise{from{opacity:.35;transform:translateY(6px)}to{opacity:1;transform:none}}
.strip{display:flex;justify-content:space-between;gap:16px;padding:22px 0 10px;border-bottom:1px solid var(--rule);font:600 11px/1.3 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.head{padding:30px 0 6px;display:flex;flex-direction:column;gap:14px}
.body{padding-top:26px;display:flex;flex-direction:column;gap:30px}
.cover{background:var(--hero);color:var(--hero-ink)}
.cover .strip{color:var(--hero-sub);border-bottom-color:var(--hero-rule)}
.cover .cv{padding:56px 0 46px;display:flex;flex-direction:column;gap:14px;min-height:300px;justify-content:flex-end}
.cover .eyebrow{color:var(--hero-sub);letter-spacing:.2em}
.cover .h1{color:var(--hero-ink)}
.cover .sub{font-size:1.2rem;color:var(--hero-ink);max-width:40ch}
.stack{display:flex;flex-direction:column;gap:18px}
.stack.tight{gap:10px}
.sec{display:flex;flex-direction:column;gap:14px}
.sec>.eyebrow{margin-bottom:-2px}

/* ---------- cards, callouts ---------- */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,var(--min,250px)),1fr));gap:16px;align-items:stretch}
.card{background:var(--panel);padding:20px;border-radius:2px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.out{background:var(--surface);border:1px solid var(--edge)}
.card.dark{background:var(--hero);color:var(--hero-ink)}
.card.dark h3,.card.dark h4,.card.dark .eyebrow,.card.dark .muted{color:var(--hero-ink)}
.card.dark .eyebrow{opacity:.85}
.card h3,.card h4{margin-top:-2px}
.card .sub{color:var(--muted);font-size:.9375rem;margin-top:-4px}
.card.sel{outline:2px solid var(--accent);outline-offset:-2px}
button.card{text-align:left;border:0;color:inherit;font:inherit;width:100%}
button.card:hover{background:var(--callout)}
.bar{background:var(--callout);padding:14px 18px;border-radius:2px;line-height:1.5;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.bar strong{font-weight:650}
.dark-bar{background:var(--hero);color:var(--hero-ink);padding:22px;border-radius:2px;display:flex;flex-direction:column;gap:10px}
.dark-bar h3{color:var(--hero-ink)}
.dark-bar a{color:var(--hero-ink);font-weight:650}
.badge{display:inline-block;align-self:flex-start;font:600 10.5px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;padding:5px 8px;background:var(--callout);color:var(--ink);border-radius:2px}
.badge.you{background:var(--btn);color:var(--btn-ink)}
.badge.on{background:var(--btn);color:var(--btn-ink)}
.badge.warm{background:var(--warm)}
.bar.good{background:var(--callout)}
.bar.soft{background:var(--warm)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:11px 20px;border:1px solid var(--btn);background:var(--btn);color:var(--btn-ink);font:600 .9375rem/1.2 var(--sans);border-radius:2px;text-decoration:none}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--edge)}
.btn.ghost:hover{background:var(--panel);filter:none}
.btn.sm{min-height:36px;padding:7px 14px;font-size:.875rem}
.btn[disabled]{opacity:.45;cursor:default}
.link{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px;font:inherit;font-weight:550;cursor:pointer;text-align:left}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* ---------- fields ---------- */
.fld{display:flex;flex-direction:column;gap:2px;min-width:0}
.lbl{font:600 .9375rem/1.35 var(--sans);color:var(--ink)}
.hint{font-weight:400;color:var(--muted)}
.ln{width:100%;display:block;border:0;border-bottom:1px solid var(--rule);background:transparent;color:var(--ink);font:400 1rem/1.4 var(--sans);padding:9px 2px 7px;border-radius:0;outline:0;min-height:42px}
.ln::placeholder{color:var(--muted);opacity:.55}
.ln:focus{border-bottom-color:var(--accent);box-shadow:0 1px 0 var(--accent);background:color-mix(in srgb,var(--accent) 6%,transparent)}
.ta{resize:none;overflow:hidden;line-height:var(--lh);padding:0 2px;min-height:calc(var(--rows,2) * var(--lh));border-bottom:0;
  background-image:linear-gradient(to bottom,transparent calc(var(--lh) - 1px),var(--rule) calc(var(--lh) - 1px));
  background-size:100% var(--lh);background-attachment:local;background-color:transparent}
.ta:focus{box-shadow:none;background-color:color-mix(in srgb,var(--accent) 6%,transparent)}
.inl{display:flex;align-items:baseline;gap:10px;min-width:0}
.inl .lbl{flex:none}
.inl .ln{flex:1;min-width:0}
.fld.inl{flex-direction:row;flex-wrap:wrap;align-items:baseline;gap:2px 12px}
.fld.inl .ln{flex:1 1 180px}
.num{display:flex;align-items:center;gap:12px}
.num .n{flex:none;width:28px;height:28px;border:1.5px solid var(--edge);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font:600 .8125rem/1 var(--sans);color:var(--ink)}
.num.solid .n{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.num .ln{flex:1}
select.ln{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 14px) 55%,calc(100% - 9px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}

/* checkboxes and radios */
.chkgrid{display:grid;grid-template-columns:repeat(var(--c,1),minmax(0,1fr));gap:0 28px}
.chk{display:flex;gap:12px;align-items:flex-start;cursor:pointer;line-height:1.4;padding:7px 0;position:relative;min-width:0}
.chk input{position:absolute;opacity:0;width:24px;height:24px;margin:0;left:0;top:5px;cursor:pointer}
.chk .box{flex:none;width:20px;height:20px;border:1.5px solid var(--edge);background:var(--surface);margin-top:1px;border-radius:2px;position:relative;transition:background .15s,border-color .15s}
.chk .box::after{content:"";position:absolute;left:5.5px;top:1.5px;width:6px;height:11px;border:solid var(--btn-ink);border-width:0 2px 2px 0;transform:rotate(45deg) scale(0);transition:transform .15s}
.chk input:checked+.box{background:var(--btn);border-color:var(--btn)}
.chk input:checked+.box::after{transform:rotate(45deg) scale(1)}
.chk input:focus-visible+.box{outline:2px solid var(--accent);outline-offset:2px}
.chk .lbl{font-weight:400;flex:1;min-width:0}
.chk.line .lbl{display:flex;align-items:center}
.chk.line .ln{padding-top:4px;padding-bottom:4px;min-height:34px}
.strike input:checked~.lbl{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--sage)}
.rad{display:inline-flex;gap:8px;align-items:center;cursor:pointer;position:relative;padding:8px 4px;min-height:40px}
.rad input{position:absolute;opacity:0;width:22px;height:22px;margin:0;left:2px}
.rad .dot{flex:none;width:20px;height:20px;border:1.5px solid var(--edge);border-radius:50%;background:var(--surface);position:relative}
.rad .dot::after{content:"";position:absolute;inset:3.5px;border-radius:50%;background:var(--btn);transform:scale(0);transition:transform .15s}
.rad input:checked+.dot::after{transform:scale(1)}
.rad input:checked+.dot{border-color:var(--btn)}
.rad input:focus-visible+.dot{outline:2px solid var(--accent);outline-offset:2px}
.radrow{display:flex;flex-wrap:wrap;gap:4px 22px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:500 .875rem/1.15 var(--sans);padding:9px 14px;border:1px solid var(--edge);background:var(--surface);color:var(--ink);border-radius:2px;min-height:40px;text-align:center}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.chip.right{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.chip.wrong{background:var(--warm);border-style:dashed}
.tg{width:34px;height:34px;border:1.5px solid var(--edge);background:var(--surface);border-radius:2px;display:inline-flex;align-items:center;justify-content:center;font:600 .8125rem/1 var(--sans);color:var(--ink);padding:0}
.tg.r{border-radius:50%}
.tg[aria-pressed="true"]{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.tg:hover{border-color:var(--accent)}
.star{font-size:1.25rem;line-height:1;background:none;border:0;padding:6px;color:var(--accent);min-width:40px;min-height:40px}

/* ---------- row grids (tables that stack on phones) ---------- */
.rows{display:flex;flex-direction:column;border-top:1px solid var(--edge)}
.rw{display:grid;grid-template-columns:var(--cols,1fr);gap:4px 18px;align-items:start;padding:10px 0;border-bottom:1px solid var(--rule)}
.rw.hd{padding:10px 0 8px;font:600 11px/1.3 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.rw.exr{background:var(--panel);padding-left:10px;padding-right:10px;margin-left:-10px;margin-right:-10px}
.rw .cell{min-width:0;display:flex;flex-direction:column;gap:2px}
.rw .cell[data-label]::before{content:attr(data-label);display:none;font:600 10.5px/1.2 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.rw .ro{font-weight:600}
.rw .ro small{display:block;font-weight:400;color:var(--muted);font-size:.8125rem}
.rw .exv{font-family:var(--serif);font-style:italic;color:var(--example);font-size:1.15rem;line-height:1.3;padding:6px 2px}
.rw .mid{align-self:center}
.rw .cell.mid{align-items:flex-start}
.rw .ln{min-height:40px}
.rw .ta{--lh:30px}

/* tabs */
.tabs{display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--edge)}
.tab{background:none;border:1px solid transparent;border-bottom:0;padding:11px 16px;font:600 .875rem/1 var(--sans);color:var(--muted);border-radius:2px 2px 0 0;margin-bottom:-1px;min-height:44px}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);border-color:var(--edge);border-bottom:1px solid var(--surface)}
.panel{padding-top:22px}

/* toc / lesson lists */
.toc{border-top:1px solid var(--edge)}
.toc-row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:14px 4px;min-height:60px}
.toc-row:hover{background:var(--panel)}
.toc-row .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.toc-row strong{font-weight:650}
.toc-row small{color:var(--muted);font-size:.875rem}
.toc-row .go{color:var(--accent);font-size:1.1rem}

/* progress */
.track{height:8px;background:var(--callout);border-radius:4px;overflow:hidden}
.track i{display:block;height:100%;background:var(--btn);width:0;transition:width .4s ease}

/* timers */
.timer{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:16px 18px;background:var(--panel);border-radius:2px}
.timer .t{font:400 2.6rem/1 var(--serif);font-variant-numeric:tabular-nums;color:var(--accent);min-width:4.4ch}
.timer .msg{flex-basis:100%;font-weight:600;color:var(--accent)}

/* pager */
.pager{margin-top:44px;padding-top:20px;border-top:1px solid var(--edge);display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center}
.pager .where{flex-basis:100%;display:flex;justify-content:space-between;font-size:.8125rem;color:var(--muted);order:3;padding-top:10px}
.legal{font-size:.8125rem;color:var(--muted);line-height:1.5;max-width:70ch;padding-top:26px}

/* home */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px}
.tile{display:flex;flex-direction:column;gap:8px;text-align:left;border:0;padding:20px;min-height:210px;border-radius:2px;background:var(--callout);color:var(--ink);justify-content:space-between}
.tile.d{background:var(--hero);color:var(--hero-ink)}
.tile .eyebrow{color:inherit;opacity:.8}
.tile h3{color:inherit;font-size:1.6rem}
.tile p{font-size:.9375rem;max-width:none}
.tile .fin{font-size:.875rem}
.tile .pg{display:flex;align-items:center;gap:10px;font-size:.8125rem}
.tile .pg .track{flex:1;background:rgba(0,0,0,.12)}
.tile.d .pg .track{background:rgba(255,255,255,.25)}
.tile .pg .track i{background:currentColor}
.tile:hover{filter:brightness(.97)}
.bonus{display:flex;flex-direction:column;gap:6px;border:1px solid var(--edge);background:var(--surface);padding:18px;text-align:left;border-radius:2px}
.bonus h4{font-size:1.4rem}
.bonus:hover{background:var(--panel)}

/* misc */
.pill{font-size:.75rem;font-weight:600;padding:3px 9px;background:var(--callout);border-radius:99px;white-space:nowrap}
.tip{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule)}
.tip:last-child{border-bottom:0}
.tip b{flex:none;min-width:8.5rem;font-weight:650}
.dl{display:grid;grid-template-columns:minmax(120px,200px) 1fr;gap:6px 18px}
.dl dt{font-weight:650}
.dl dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.flash{animation:flash 1.6s ease}
@keyframes flash{0%,60%{box-shadow:0 0 0 3px var(--sage)}100%{box-shadow:0 0 0 0 transparent}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:2px;font-size:.875rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:40;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.libcols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.libcol{display:flex;flex-direction:column;gap:16px;min-width:0}

/* ============ small DOM helpers ============ */
let UID = 0;
const uid = p => (p || "u") + (++UID);

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "value" || k === "checked" || k === "disabled" || k === "selected") el[k] = v;
    else if (k === "style" && typeof v === "object") {
      for (const sk in v) { if (sk.startsWith("--")) el.style.setProperty(sk, v[sk]); else el.style[sk] = v[sk]; }
    }
    else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}

/* **bold** and *italic* inside strings */
function rt(s) {
  const f = document.createDocumentFragment();
  String(s).split(/(\*\*[^*]+\*\*|\*[^*]+\*)/).forEach(p => {
    if (!p) return;
    if (p.startsWith("**")) f.append(h("strong", null, p.slice(2, -2)));
    else if (p[0] === "*" && p.length > 2) f.append(h("em", null, p.slice(1, -1)));
    else f.append(p);
  });
  return f;
}

/* ============ saved answers ============ */
const KEY = "wendaful-sfrl-v1";
let S = {};
let storageOK = true;
try { S = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { storageOK = false; S = {}; }

let saveT = null;
function paintSave(pending) {
  const n = document.getElementById("saveNote");
  if (!n) return;
  n.textContent = !storageOK ? "This browser will not keep your answers. Use Backup in My workbook before you leave."
    : pending ? "Saving…" : "Your answers are saved on this device.";
}
function flush() {
  clearTimeout(saveT); saveT = null;
  try { localStorage.setItem(KEY, JSON.stringify(S)); storageOK = true; } catch (e) { storageOK = false; }
  paintSave(false);
}
function queueSave() { clearTimeout(saveT); saveT = setTimeout(flush, 300); paintSave(true); }
const get = (k, d) => (k in S) ? S[k] : (d === undefined ? "" : d);
function set(k, v, keep) {
  if (!keep && (v === "" || v === false || v == null)) delete S[k]; else S[k] = v;
  queueSave();
  if (k.startsWith("done.")) refreshChrome();
}
function clearPrefix(p) { Object.keys(S).forEach(k => { if (k.startsWith(p)) delete S[k]; }); queueSave(); }
const hasAny = p => Object.keys(S).some(k => k.startsWith(p));
addEventListener("pagehide", flush);
document.addEventListener("visibilitychange", () => { if (document.hidden) flush(); });

const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };

/* ============ toast, copy, save a file ============ */
let toastT = null;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2200);
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast("Copied"); return true; }
  catch (e) {
    const ta = h("textarea", { style: { position: "fixed", opacity: "0", left: "0", top: "0" } });
    ta.value = text; document.body.append(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch (_) { }
    ta.remove(); toast(ok ? "Copied" : "Copy did not work here. Select the text and copy it."); return ok;
  }
}
let DL = null;
(async () => { try { if (window.claude && claude.use) DL = await claude.use("downloads"); } catch (e) { DL = null; } })();
async function saveFile(name, data) {
  if (!DL) { toast("Saving a file is not available here. Use Copy instead."); return false; }
  try { await DL.save({ filename: name, data }); toast("Saved"); return true; }
  catch (e) { if (!e || e.code !== "declined") toast("Could not save a file here. Use Copy instead."); return false; }
}

/* ============ form pieces ============ */
function grow(t) { if (!t.offsetParent) return; t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; }

function wrapField(o, child) {
  return h("div", { class: "fld " + ((o && o.cls) || "") },
    o && o.label ? h("div", { class: "lbl" }, rt(o.label), o.hint ? h("span", { class: "hint" }, " " + o.hint) : null) : null,
    child);
}

/* lined single line or ruled paper (rows > 1) */
function field(k, o = {}) {
  const rows = o.rows || 1, id = uid("f");
  const inp = rows > 1
    ? h("textarea", { id, class: "ln ta", rows, placeholder: o.ph || "", style: { "--rows": rows } })
    : h("input", { id, class: "ln", type: "text", placeholder: o.ph || "", autocomplete: "off", list: o.list || null });
  inp.value = get(k, o.def || "");
  inp.addEventListener("input", () => {
    set(k, inp.value, !!o.def);
    if (rows > 1) grow(inp);
    if (o.onInput) o.onInput(inp.value);
  });
  const lab = o.label ? h("label", { class: "lbl", for: id }, rt(o.label), o.hint ? h("span", { class: "hint" }, " " + o.hint) : null) : null;
  const f = h("div", { class: "fld " + (o.cls || "") }, lab, inp);
  f.input = inp;
  return f;
}
/* bare input for grids (no label) */
function cellInput(k, o = {}) {
  const inp = o.rows > 1
    ? h("textarea", { class: "ln ta", rows: o.rows, placeholder: o.ph || "", style: { "--rows": o.rows }, "aria-label": o.aria || null })
    : h("input", { class: "ln", type: "text", placeholder: o.ph || "", autocomplete: "off", list: o.list || null, "aria-label": o.aria || null });

  inp.addEventListener("input", () => { set(k, inp.value, !!o.def); if (o.rows > 1) grow(inp); if (o.onInput) o.onInput(inp.value); });

}
function numbered(k, n, o = {}) {
  const list = h("div", { class: "stack tight" });
  for (let i = 0; i < n; i++) {
    const inp = h("input", { class: "ln", type: "text", autocomplete: "off", placeholder: (o.ph && o.ph[i]) || "", "aria-label": (o.name || "Item") + " " + (i + 1) });

    inp.addEventListener("input", () => { set(k + "." + i, inp.value); if (o.onInput) o.onInput(); });

}

    h("span", { class: "lbl" }, typeof label === "string" ? rt(label) : label));

}
function checks(k, items, o = {}) {
  const grid = h("div", { class: "chkgrid" + (o.strike ? " strike" : ""), style: { "--c": o.cols || 1 } });
  items.forEach((it, i) => {
    if (it && it.other) {

      t.value = get(k + ".otherText"); t.addEventListener("input", () => set(k + ".otherText", t.value));
      grid.append(chkEl(k + ".other", h("span", { class: "inl" }, it.label || "Something else:", t), { cls: "line" }));

}
function radios(k, opts, o = {}) {
  const name = uid("r"), row = h("div", { class: "radrow" });
  opts.forEach(v => {
    const inp = h("input", { type: "radio", name, value: v });
    inp.checked = get(k) === v;
    inp.addEventListener("change", () => { set(k, v); if (o.onChange) o.onChange(v); });
    row.append(h("label", { class: "rad" }, inp, h("span", { class: "dot", "aria-hidden": "true" }), v));

}
/* a circle you pick, no text. name groups a row */
function dotRadio(k, v, name, aria) {
  const inp = h("input", { type: "radio", name, value: v, "aria-label": aria });
  inp.checked = get(k) === v;

  }, v));

  return wrapField(o, wrap);
}
/* a square or round button that fills in when you tap it */
function tg(k, o = {}) {

const p = (t, cls) => h("p", { class: cls || null }, rt(t));
const eyebrow = t => h("div", { class: "eyebrow" }, t);
const sec = (title, ...kids) => h("section", { class: "sec" }, title ? (typeof title === "string" ? h("h2", null, title) : title) : null, ...kids);
const stack = (...kids) => h("div", { class: "stack" }, ...kids);

function bar(text, o = {}) { return h("div", { class: "bar " + (o.cls || "") }, h("p", null, rt(text)), o.extra || null); }

/* two-step confirm button that never uses a browser dialog */
function confirmBtn(label, confirmLabel, fn, cls) {
  let armed = false, t = null;
  const b = h("button", { type: "button", class: "btn " + (cls || "ghost sm") }, label);
  b.addEventListener("click", () => {

/* tabs keep every panel built, so typed answers stay put */
const TABMEM = {};
function tabs(key, labels, panels) {
  const root = h("div", { class: "tabsroot" });
  const list = h("div", { class: "tabs", role: "tablist" });
  const ps = panels.map(x => h("div", { class: "panel", role: "tabpanel" }, x));

/* ============ timer ============ */
let AC = null;
function unlockAudio() { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === "suspended") AC.resume(); } catch (e) { } }
function beep() {
  try {
    if (!AC) return;
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.type = "sine"; o.frequency.value = 587; g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(.18, t + .06); g.gain.exponentialRampToValueAtTime(.0001, t + 1.3);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + 1.4);
  } catch (e) { }
}
function timer(o = {}) {
  const mins = () => Math.max(1, Math.min(180, Math.round(Number(o.getMinutes ? o.getMinutes() : o.minutes) || 10)));
  const fmt = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
  let left = mins() * 60000, end = 0, iv = null, running = false;
  const t = h("span", { class: "t" }, fmt(left));
  const msg = h("div", { class: "msg", hidden: true }, o.doneMsg || "Time’s up. That counts.");
  const go = h("button", { type: "button", class: "btn" }, o.label || "Start timer");
  const rs = h("button", { type: "button", class: "btn ghost sm" }, "Reset");
  const stop = () => { clearInterval(iv); iv = null; running = false; go.textContent = left < mins() * 60000 && left > 0 ? "Keep going" : (o.label || "Start timer"); };
  const tick = () => {
    if (!t.isConnected) { clearInterval(iv); return; }
    left = end - Date.now(); t.textContent = fmt(left);
    if (left <= 0) { left = 0; t.textContent = fmt(0); stop(); go.textContent = "Again"; msg.hidden = false; beep(); if (o.onDone) o.onDone(); }
  };
  go.addEventListener("click", () => {
    unlockAudio();
    if (running) { stop(); return; }
    if (left <= 0 || go.textContent === "Again") left = mins() * 60000;
    msg.hidden = true; running = true; end = Date.now() + left; go.textContent = "Pause";
    iv = setInterval(tick, 250);
  });
  rs.addEventListener("click", () => { stop(); left = mins() * 60000; t.textContent = fmt(left); msg.hidden = true; go.textContent = o.label || "Start timer"; });
  const root = h("div", { class: "timer" }, t, go, rs, msg);
  root.refresh = () => { if (!running) { left = mins() * 60000; t.textContent = fmt(left); } };
  return root;
}

/* ============ course registry ============ */
const MODS = [], LESSONS = [], BYID = {};
function mod(def) { def.lessons = []; MODS.push(def); return def; }
function lesson(mid, def) {

  def.mod = m; m.lessons.push(def); def.idx = LESSONS.length; LESSONS.push(def); BYID[def.id] = def;
  return def;
}
const isDone = id => !!S["done." + id];
const modDone = m => m.lessons.filter(l => isDone(l.id)).length;
const totalDone = () => LESSONS.filter(l => isDone(l.id)).length;

    const head = h("button", { type: "button", class: "nh", "aria-expanded": "false" },
      h("span", { class: "t" }, h("span", { class: "eyebrow" }, m.label), h("b", null, m.title)),

<script>
"use strict";
/* ============ shared pieces for lists and systems ============ */
const AREAS = [["Home", "Cleaning, laundry, clutter"], ["Meals", "Planning, groceries, cooking"], ["Money", "Bills, budget, paperwork"],
  ["Kids and family", "School, activities, schedules"], ["Work or business", "Tasks, projects, deadlines"],
  ["Health and movement", "Sleep, exercise, appointments"], ["Relationships", "Partner, friends, family time"], ["Rest and fun", "Hobbies, downtime, things I enjoy"]];
const SNAGS = [["No clear time", "It never has a spot in my week.", "give it a calendar block."], ["No reminder", "I only think of it when it’s already late.", "tie it to something you already do."],
  ["Too many steps", "It feels big, so I put it off.", "cut it down to 3 steps."], ["No home", "The stuff or the info has no set place.", "pick one spot and keep it there."]];
const builderName = n => get("sb." + n + ".name");
const builderNames = () => [1, 2, 3].map(builderName).filter(Boolean);
const focusNames = () => [1, 2, 3].map(n => get("focus." + n + ".name")).filter(Boolean);

/* a card of tick boxes. groups: [{h?, items:[...]}] or items:[...] */
function checklistCard(o) {
  const id = o.id, k = i => "cl." + id + "." + i;
  if (o.daily && get("cl." + id + ".d") !== today()) {
    Object.keys(S).forEach(x => { if (x.startsWith("cl." + id + ".") && x !== "cl." + id + ".d") delete S[x]; });
    set("cl." + id + ".d", today());
  }
  const body = h("div", { class: "cl strike" }), boxes = [];
  let idx = 0;
  (o.groups || [{ items: o.items }]).forEach(g => {
    if (g.h) body.append(h("div", { class: "grp" }, g.h));
    g.items.forEach(t => { const i = idx++; const c = chkEl(k(i), t, { onChange: upd }); boxes.push(c.input); body.append(c); });
  });
  const cnt = h("span"), clr = link("Clear checks", () => { boxes.forEach((b, i) => { b.checked = false; set(k(i), false); }); upd(); });
  function upd() { const n = boxes.filter(b => b.checked).length; cnt.textContent = n + " of " + boxes.length + (o.daily ? " · fresh each day" : ""); clr.hidden = !n; }
  upd();
  return card({ id, cls: o.tone === "tint" ? "" : "out", badge: o.badge, badgeCls: o.badge === "Yours" ? "you" : "", title: o.title, h: "h3", sub: o.sub,
    kids: [body, o.after ? p(o.after, "small") : null, h("div", { class: "cl-foot" }, cnt, clr)] });
}
/* a card of blank lines with tick boxes, rows can be added */
function customList(id, o = {}) {
  const max = o.max || 20, nk = "cx." + id + ".n";
  const tk = i => o.textKey ? o.textKey(i) : "cx." + id + "." + i + ".t";
  const box = h("div", { class: "stack tight" });
  const draw = () => {
    box.replaceChildren();
    const n = Number(get(nk, o.n || 6));
    for (let i = 0; i < n; i++) {
      const inp = cellInput(tk(i), { aria: "List item " + (i + 1) });
      box.append(chkEl("cx." + id + "." + i + ".c", inp, { cls: "line" }));
    }
  };
  draw();
  const add = o.fixed ? null : btn("Add a row", () => { const n = Number(get(nk, o.n || 6)); if (n < max) { set(nk, n + 1); draw(); } }, "ghost sm");
  return card({ id, cls: o.tone === "tint" ? "" : "out", badge: o.badge, badgeCls: o.badge === "Yours" ? "you" : "", title: o.title, h: "h3", sub: o.sub,
    kids: [o.titleLabel ? field("cx." + id + ".title", { label: o.titleLabel, cls: "inl" }) : null, o.useLabel ? field("cx." + id + ".use", { label: o.useLabel, cls: "inl" }) : null, box, add ? h("div", null, add) : null] });
}
/* a two-column library page */
function libPage(left, right) { return h("div", { class: "libcols" }, h("div", { class: "libcol" }, ...left), h("div", { class: "libcol" }, ...right)); }

<script>
"use strict";
/* ============ system builder helpers ============ */
const PRESETS = {
  launch: { name: "Evening launch pad", area: "Home", decision: "“What do we need today?” during the morning rush", trigger: "Right after dinner cleanup",
    steps: ["Clear the sink", "Prep the coffee and set it to brew on its own", "Fill water bottles and pack bags", "Set out tomorrow’s clothes", "Open my planner, block my time, pick my top 3"],
    lives: [], where: "A routine card at the back of my planner", low: "Pack the bags and pick my top 3", easier: "The coffee maker runs on a timer" },
  dinner: { name: "Dinner rotation", area: "Meals", decision: "“What’s for dinner?” every afternoon", trigger: "My Sunday reset",
    steps: ["Pick 5 meals from our go-to list", "Check the calendar for busy nights", "Order the groceries", "Post the plan on the fridge"],
    lives: [1, 3], where: "Calendar for the Sunday block. Notes for the go-to meal list.", low: "Repeat last week’s plan", easier: "" },
  tray: { name: "School paper tray", area: "Kids and family", decision: "“Where did that form go?”", trigger: "The kids walk in the door",
    steps: ["Papers go in the tray by the door", "I check the tray after dinner", "Dates go on the calendar", "Signed forms go back in the backpack"],
    lives: [0, 1], where: "Inbox is the tray by the door. Dates go on the calendar.", low: "Dates on the calendar only. The rest waits until tomorrow.", easier: "" }
};
const idea = (name, area, text, low) => ({ name, area, steps: text.split(/\.\s+/).map(s => s.replace(/\.$/, "")).filter(Boolean), low: low ? low.replace(/^./, c => c.toUpperCase()) : "", lives: [] });
const IDEAS_A = [
  ["Home", "The 10-minute closing shift", "Set a timer after dinner. Clear the counters, start the dishwasher, and stop when it rings."],
  ["Meals", "Five meals on repeat", "Pick 5 meals on Sunday, order the groceries, and post the plan on the fridge."],
  ["Money", "Bill day", "Same day every week. Open the mail, pay what’s due, and file the rest in one folder."],
  ["Kids and family", "The paper tray", "One tray by the door. Check it after dinner and put the dates on the calendar."],
  ["Work or business", "Top 3 before email", "Pick 3 tasks the night before. Do the first one before you open your inbox."],
  ["Health and movement", "Clothes out the night before", "Set out workout clothes and fill your water bottle. Put the same days on the calendar each week."],
  ["Relationships", "The standing date", "One repeating plan on the calendar, like a monthly coffee with a friend."],
  ["Rest and fun", "The Friday night default", "The same easy plan every week, like pizza and a movie, so nobody has to decide."]];
const IDEAS_B = [
  ["Working out", "Health and movement", "Same days, same time", "Put 3 workouts on the calendar. Set out clothes the night before and press play on a saved video.", "a 10-minute walk."],
  ["YouTube videos", "Work or business", "Batch day in four blocks", "Set up for 10 minutes. Then film, edit, and schedule, with each one in its own block.", "switch to captions or scheduling."],
  ["Weekly content", "Work or business", "Batch by format", "Film all your short clips in one sitting. Write every caption in one writing block.", "post one thing, anything."],
  ["Cleaning", "Home", "One room a day", "Monday bathrooms. Tuesday kitchen. Wednesday office. Thursday living room. Friday bedrooms.", "clean one surface."],
  ["Kitchen", "Home", "Clean while it cooks", "Load the dishwasher and wipe as you go. Run it every night and empty it every morning.", "run the dishwasher."],
  ["Laundry", "Home", "One load a day", "Start a load in the morning, switch it at lunch, and fold it during a show.", "wash and dry, fold tomorrow."],
  ["Email", "Work or business", "Two check-ins a day", "Open your inbox at set times. Reply if it takes 2 minutes. The rest goes on your task list.", "flag 3 and close it."],
  ["Clutter piles", "Home", "One pile, one timer", "Pick one pile and set a timer for 10 minutes. Sort into keep, toss, and move.", "toss 5 things."]];

function fillBuilder(n, d) {
  clearPrefix("sb." + n + ".");
  const k = "sb." + n + ".";
  set(k + "name", d.name); set(k + "area", d.area); if (d.decision) set(k + "decision", d.decision); if (d.trigger) set(k + "trigger", d.trigger);

    const paintCmp = () => {
      const a = total(1), b = total(2);
      cmp.replaceChildren(h("div", { class: "row" }, h("span", { class: "pill" }, "Round 1: " + a + " boxes"), h("span", { class: "pill" }, "Round 2: " + b + " boxes")),
        p(a && b ? (b > a ? "**Round 2 has " + (b - a) + " more colored boxes.** More than last month means it’s working." : b === a ? "**Same number of boxes in both rounds.** Showing up the same way twice is a win." : "**Round 1 had more boxes.** That’s okay. Pick your floor again and start the next round small.")
          : "Color some boxes in both rounds to see how they compare.", "small"));
    };
    const habit = (r, hb) => {
      const k = "tr." + r + "." + hb + ".", cnt = h("span", { class: "pill" });
      const upd = () => { let n = 0; for (let w = 1; w <= 4; w++) for (let d = 0; d < 7; d++) if (get(k + w + "." + d)) n++; cnt.textContent = n + " boxes colored"; paintCmp(); };
      const g = h("div", { class: "trk" }, h("span"), ...D.map(x => h("span", { class: "hd" }, x)));
      for (let w = 1; w <= 4; w++) { g.append(h("span", { class: "wk" }, "Wk " + w)); for (let d = 0; d < 7; d++) g.append(tg(k + w + "." + d, { aria: "Habit " + hb + " week " + w + " " + D[d], onChange: upd })); }
      let n = 0; for (let w = 1; w <= 4; w++) for (let d = 0; d < 7; d++) if (get(k + w + "." + d)) n++; cnt.textContent = n + " boxes colored";
      return card({ cls: "out", kids: [h("div", { class: "cols", style: { "--min": "220px" } }, field(k + "name", { label: "Habit " + hb }), field(k + "floor", { label: "My floor" })), g, cnt] });
    };
    paintCmp();
    return [tabs("tr", ["Round 1 of 2", "Round 2 of 2"], [1, 2].map(r => stack(...[1, 2, 3].map(hb => habit(r, hb))))), cmp,
      bar("**What to look for:** count the boxes you colored, and leave the blank ones out of the math. More colored boxes than last month means it’s working.")];
  } });
